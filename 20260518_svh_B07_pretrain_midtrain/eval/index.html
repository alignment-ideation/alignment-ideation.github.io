<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pairwise Idea Preference — Pretraining / midtraining for alignment</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root {
    --primary: #C15F3C;
    --primary-hover: #9C4A2D;
    --bg: #F4F3EE;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --text-secondary: #666666;
    --muted: #999999;
    --border: #E0DDD4;
    --row-hover: #FAFAF7;
    --accent-soft: #FDF2EC;
    --gold: #C99C2C;
    --gold-dark: #92400E;
    --gold-bg: #FEF3C7;
    --gold-soft: #FEF7E0;
    --success: #2D8F6F;
    --success-hover: #226E55;
    --success-bg: #D1FAE5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 14px;
}
.app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 1600px; margin: 0 auto;
    padding: 10px 16px 10px 16px;
    gap: 10px;
}
.hidden { display: none !important; }

/* Compact topbar */
.topbar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
}
.topbar-title { font-size: 1rem; font-weight: 700; line-height: 1.2; }
.topbar-sub { font-size: 0.78rem; opacity: 0.92; margin-top: 1px; font-variant-numeric: tabular-nums; }
.topbar-progress {
    width: 240px; height: 6px; background: rgba(255,255,255,0.25);
    border-radius: 10px; overflow: hidden;
}
.topbar-progress-fill { background: white; height: 100%; border-radius: 10px; transition: width 0.3s ease; }
.topbar-help {
    background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    transition: all 0.12s;
}
.topbar-help:hover { background: rgba(255,255,255,0.28); border-color: rgba(255,255,255,0.5); }

/* Registration screen — collected before onboarding */
.registration-screen {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 32px;
}
.registration-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 30px 36px; max-width: 480px; width: 100%;
}
.registration-card h2 { color: var(--primary); font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; }
.registration-card .intro { color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 20px; line-height: 1.55; }
.reg-field { margin-bottom: 14px; }
.reg-field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 5px; }
.reg-field input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 0.95rem;
}
.reg-field input:focus { outline: none; border-color: var(--primary); }
.reg-error { color: var(--primary); font-size: 0.82rem; margin-top: 4px; min-height: 1em; }
.reg-foot { font-size: 0.78rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.reg-submit-wrap { margin-top: 20px; text-align: center; }
.reg-submit-btn {
    background: var(--primary); color: white; border: 1px solid var(--primary);
    padding: 11px 28px; border-radius: 8px;
    font-size: 0.98rem; font-weight: 700; cursor: pointer; transition: all 0.12s;
}
.reg-submit-btn:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.reg-submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Onboarding screen (scrolls) */
.onboarding-screen {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; justify-content: center;
}
.onboarding-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 820px; width: 100%;
    margin: 4px auto 20px auto;
    height: max-content;
}
.onboarding-card h2 {
    color: var(--primary); font-size: 1.3rem; font-weight: 700;
    margin-bottom: 18px;
}
.onboarding-section { border-top: 1px solid var(--border); padding: 14px 0; }
.onboarding-section:first-of-type { border-top: none; padding-top: 4px; }
.onboarding-section .sec-title {
    font-weight: 700; color: var(--text);
    font-size: 1rem; margin-bottom: 4px;
}
.onboarding-section .sec-body { color: var(--text); font-size: 0.94rem; line-height: 1.7; }
.onboarding-section .sec-body p { margin: 6px 0; }
.onboarding-section .sec-body ul, .onboarding-section .sec-body ol { margin: 6px 0 6px 22px; }
.onboarding-section .sec-body li { margin: 3px 0; }
.onboarding-section .sec-body code { background: var(--accent-soft); color: var(--primary); padding: 1px 5px; border-radius: 3px; font-size: 0.88em; }
.onboarding-section .sec-body a { color: var(--primary); }

/* Eval screen: flex column filling remaining viewport. */
.eval-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

/* Idea grid: fills remaining vertical space; each card scrolls internally. */
.idea-grid {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.idea-card {
    background: var(--row-hover);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
.idea-card .card-head {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px 8px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.5);
}
.idea-card .idea-title { font-size: 0.98rem; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
.idea-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 10px 16px 14px 16px;
    font-size: 0.88rem; line-height: 1.6; color: var(--text);
}
.idea-body p { margin: 5px 0; }
.idea-body ul, .idea-body ol { margin: 5px 0 5px 20px; }
.idea-body li { margin: 2px 0; }
.idea-body strong { color: var(--text); }
.idea-body h1, .idea-body h2, .idea-body h3, .idea-body h4 {
    font-size: 0.95rem; font-weight: 700; color: var(--primary); margin: 10px 0 4px 0;
}
.idea-body h1:first-child, .idea-body h2:first-child, .idea-body h3:first-child, .idea-body h4:first-child { margin-top: 0; }

.idea-badge {
    display: inline-block;
    font-weight: 800; font-size: 0.74rem; letter-spacing: 1px;
    padding: 2px 9px; border-radius: 4px;
    background: var(--success); color: white;
}

/* Preference button row: A is better / Both equal / B is better */
.pref-row {
    flex: none;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px;
}
.pref-btn {
    background: var(--surface); color: var(--text);
    border: 1.5px solid var(--border);
    padding: 10px 14px; border-radius: 8px;
    font-size: 0.92rem; font-weight: 700;
    cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.pref-btn:hover { border-color: var(--success); color: var(--success); }
.pref-btn.selected {
    background: var(--success); border-color: var(--success); color: white;
    box-shadow: 0 2px 8px rgba(45, 143, 111, 0.25);
}
.pref-btn.selected:hover { background: var(--success-hover); border-color: var(--success-hover); color: white; }

/* Tie button uses a neutral grey instead of green to avoid implying preference. */
.pref-btn[data-choice="tie"]:hover { border-color: #6B7280; color: #6B7280; }
.pref-btn[data-choice="tie"].selected {
    background: #6B7280; border-color: #6B7280; color: white;
    box-shadow: 0 2px 8px rgba(107, 114, 128, 0.25);
}
.pref-btn[data-choice="tie"].selected:hover { background: #4B5563; border-color: #4B5563; color: white; }
.pref-btn .kbd-mini {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.72rem; font-weight: 600;
    background: var(--bg); color: var(--text-secondary);
    padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border);
}
.pref-btn.selected .kbd-mini { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.35); color: white; }

/* Inline notes textarea, single row in the bottom band */
.notes-row {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px;
}
.notes-row label { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.3px; text-transform: uppercase; flex: none; }
.notes-row textarea {
    flex: 1; min-height: 28px; max-height: 70px; resize: vertical;
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 0.85rem; line-height: 1.4;
}
.notes-row textarea:focus { outline: none; border-color: var(--primary); }

/* Bottom nav: prev / pager dots / submit / next */
.nav-bar {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px;
}
.pager-dots { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pager-dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 0.74rem; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; transition: all 0.12s;
}
.pager-dot:hover { border-color: var(--primary); color: var(--primary); }
.pager-dot.current { background: var(--primary); border-color: var(--primary); color: white; }
.pager-dot.answered { color: var(--success); border-color: var(--success); background: var(--success-bg); }
.pager-dot.current.answered { background: var(--success); border-color: var(--success); color: white; }
.nav-side { display: flex; align-items: center; gap: 6px; }

.btn {
    padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: all 0.12s;
}
.btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
.btn.btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); color: white; }
.btn.btn-primary:disabled { background: var(--primary); border-color: var(--primary); color: white; opacity: 0.4; }

.kbd { display: inline-block; padding: 1px 6px; background: var(--bg); border: 1px solid var(--border);
       border-radius: 3px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.74rem; }

/* Summary screen — review picks before submitting */
.summary-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.summary-header {
    flex: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px;
}
.summary-header h2 { color: var(--primary); font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
.summary-header .sub { color: var(--text-secondary); font-size: 0.88rem; }
.summary-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
.summary-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
    display: grid; grid-template-columns: 60px 1fr 160px; gap: 12px; align-items: center;
    cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s;
}
.summary-row:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(193, 95, 60, 0.06); }
.summary-row.unanswered { border-color: #E0B4A8; background: #FBEEE8; }
.summary-row .pair-no { font-size: 0.78rem; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; }
.summary-titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.summary-title {
    display: flex; gap: 8px; align-items: baseline; min-width: 0;
    font-size: 0.88rem; color: var(--text-secondary);
}
.summary-title .idea-badge { flex: none; }
.summary-title .ttext {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.summary-title.winner { color: var(--text); font-weight: 600; }
.summary-title.winner .ttext { color: var(--text); }
.summary-pick {
    text-align: center; font-size: 0.85rem; font-weight: 700;
    padding: 6px 10px; border-radius: 6px;
    background: var(--success); color: white;
    white-space: nowrap;
}
.summary-pick.tie { background: #6B7280; }
.summary-pick.none { background: #F4F3EE; color: #B25C46; border: 1px dashed #D49A8B; font-weight: 600; }

/* Onboarding screen start button */
.onboarding-start-wrap { margin-top: 24px; text-align: center; }
.onboarding-start-btn {
    background: var(--primary); color: white;
    border: 1px solid var(--primary);
    padding: 12px 32px; border-radius: 8px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: all 0.12s;
}
.onboarding-start-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

/* Help overlay (reused from v5 style) */
.help-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
}
.help-modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 32px 36px;
    max-width: 780px; width: 100%;
    max-height: 88vh; overflow-y: auto;
    position: relative;
    font-size: 0.95rem; line-height: 1.7;
}
.help-modal h2 { color: var(--primary); font-size: 1.3rem; margin-bottom: 16px; }
.help-modal .help-section { border-top: 1px solid var(--border); padding: 14px 0; }
.help-modal .help-section:first-of-type { border-top: none; padding-top: 4px; }
.help-modal .help-section .h-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
.help-modal .help-section a { color: var(--primary); }
.help-modal .help-section code { background: var(--accent-soft); color: var(--primary); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }
.help-modal img { max-width: 100%; height: auto; }
.help-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none;
    font-size: 1.6rem; cursor: pointer;
    color: var(--text-secondary); padding: 4px 10px;
    line-height: 1;
}
.help-close:hover { color: var(--text); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #D5D2C9; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* ---- Prod: Submission Status ---- */
#submission-status {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.8;
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">Pretraining / midtraining for alignment</div>
      <div class="topbar-sub" id="topbar-sub">4 pairs · 0 winners picked</div>
    </div>
    <div class="topbar-progress"><div class="topbar-progress-fill" id="progress-fill" style="width: 0%"></div></div>
    <button class="topbar-help" onclick="showHelp()">? Help</button>
  </div>

  <div id="registration-screen" class="registration-screen hidden">
    <div class="registration-card">
      <h2>Before we start</h2>
      <div class="reg-field">
        <label for="reg-name">Name</label>
        <input id="reg-name" type="text" autocomplete="name" oninput="onRegInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('reg-email').focus();}">
      </div>
      <div class="reg-field">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" oninput="onRegInput()" onkeydown="if(event.key==='Enter')submitRegistration()">
        <div class="reg-error" id="reg-error"></div>
      </div>
      <div class="reg-submit-wrap">
        <button class="reg-submit-btn" id="reg-submit-btn" disabled onclick="submitRegistration()">Continue &rarr;</button>
      </div>
    </div>
  </div>

  <div id="onboarding-screen" class="onboarding-screen hidden">
    <div class="onboarding-card" id="onboarding-card"></div>
  </div>

  <div id="eval-screen" class="eval-screen hidden">
    <div class="idea-grid" id="idea-grid"></div>

    <div class="pref-row" id="pref-row">
      <button class="pref-btn" data-choice="A" onclick="pick('A')">A is better <span class="kbd-mini">A</span></button>
      <button class="pref-btn" data-choice="tie" onclick="pick('tie')">Both are equal <span class="kbd-mini">E</span></button>
      <button class="pref-btn" data-choice="B" onclick="pick('B')">B is better <span class="kbd-mini">B</span></button>
    </div>

    <div class="notes-row">
      <label for="notes-current">Optional — justify your decision</label>
      <textarea id="notes-current" placeholder="A short note helps a lot when we read these later." oninput="onNotesInput(this.value)"></textarea>
    </div>

    <div class="nav-bar">
      <div class="nav-side">
        <button class="btn" id="prev-btn" onclick="navPrev()">&larr; Prev</button>
        <button class="btn" id="next-btn" onclick="navNext()">Next &rarr;</button>
      </div>
      <div class="pager-dots" id="pager"></div>
      <div class="nav-side">
        <span style="font-size:0.75rem; color: var(--text-secondary);"><span class="kbd">A</span>/<span class="kbd">E</span>/<span class="kbd">B</span> pick · <span class="kbd">←</span>/<span class="kbd">→</span> move</span>
        <button class="btn btn-primary" id="submit-btn" disabled onclick="downloadResults()">Submit &amp; Download Rankings (0 ranked)</button>
            <div id="submission-status" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="summary-screen" class="summary-screen hidden">
    <div class="summary-header">
      <h2>Review your picks</h2>
      <div class="sub" id="summary-sub"></div>
    </div>
    <div class="summary-list" id="summary-list"></div>
    <div class="nav-bar">
      <div class="nav-side">
        <button class="btn" onclick="exitSummary()">&larr; Back to pairs</button>
      </div>
      <div style="font-size:0.78rem; color: var(--text-secondary);">Click a row to revise that pair.</div>
      <div class="nav-side">
        <button class="btn btn-primary" id="summary-submit-btn" disabled onclick="downloadResults()">Submit (0 / 0)</button>
      </div>
    </div>
  </div>
</div>

<div id="help-overlay" class="help-overlay hidden" onclick="if(event.target===this)hideHelp()">
  <div class="help-modal">
    <button class="help-close" onclick="hideHelp()" aria-label="Close">&times;</button>
    <h2>Instructions</h2>
    <div id="help-content"></div>
  </div>
</div>
<script>
let STORAGE_KEY = 'rankings_prod_20260518_svh_B07_pretrain_midtrain_default';
const EVAL_ID = '20260518_svh_B07_pretrain_midtrain';
const FIREBASE_CONFIG = {"apiKey": "AIzaSyCdA4CKt5bFOBUtsWS3M2bVL886Kwlo3tU", "authDomain": "alignment-ideation-eval.firebaseapp.com", "projectId": "alignment-ideation-eval", "storageBucket": "alignment-ideation-eval.firebasestorage.app", "messagingSenderId": "614201829143", "appId": "1:614201829143:web:4d2a25a4ba3e019a037952"};
const EMAILJS_CONFIG = {"service_id": "service_sdkgwjx", "template_id": "template_pztjzon", "public_key": "USnRousNcwC1uAee-"};

const ONBOARDING_SECTIONS = [{"title": "Before You Begin", "body": "You are comparing pairs of AI safety research ideas. In each pair, two ideas — labelled **A** and **B** — were written in response to the same research prompt. You don't know which is which: one is from a human researcher and one is AI-generated. Your job is to pick the one you'd rather see pursued in an [Anthropic Fellows Program](https://alignment.anthropic.com/2025/anthropic-fellows-program-2026/) (AFP) project.\n\nFacts about the Anthropic Fellows Program (for context on what's pursuable):\n\n* 4 months\n* 2 fellows per project\n* $15k/month compute budget each\n* Unlimited access to the Claude API, but no access to internal tooling or data\n\nIf you are less familiar with the sort of empirical technical alignment research done by Anthropic's Fellows Program, skim [https://alignment.anthropic.com/](https://alignment.anthropic.com/) and come back."}, {"title": "Scope vs Quality", "body": "Ideas don't need to fit the 4-month window perfectly — scope can be adjusted afterwards. What matters is whether the underlying research taste is good: whether fleshing the idea out would uncover research questions and experiments worth pursuing, and ultimately make Transformative AI go well.\n\nThe info that conveys taste should already be present in the idea."}, {"title": "How to choose between A and B", "body": "A useful framework:\n\n1. Read the prompt and categorise what sub-area this is about (AI control, scalable oversight, alignment training, CoT monitorability, adversarial robustness, alignment auditing agents, …).\n2. Think briefly about what good work in that sub-area would look like — what matters, what's hard, what would actually move the needle.\n3. Compare A and B on two axes:\n    * **High-level taste**: problem framing, research questions, why-it-matters, deliverable. Does this idea aim at something that matters and would teach us something we don't already know?\n    * **Approach**: are the technical choices load-bearing and well-justified, or generic? Are the hard parts named? Does the approach actually deliver on the high-level pitch?\n4. Click the idea you'd rather see pursued. You can change your mind any time by clicking the other card."}, {"title": "Close calls", "body": "Some pairs will be genuinely hard to separate — that's fine. Pick whichever side you lean toward, even if barely. Don't agonise; the aggregate of many small leans is informative."}, {"title": "Individual idea quality vs answering the prompt", "body": "Both ideas in each pair address the prompt sufficiently well by our standards — focus on the *content* of the ideas rather than how well they answer the question."}, {"title": "Using the interface", "body": "One pair per page. Click the card you want to crown — it turns gold. Use the **Prev** / **Next** buttons or arrow keys to move between pairs; press **A** or **B** to pick from the keyboard. The **Submit** button at the bottom unlocks once every pair has a winner."}];
const QUESTIONS = [{"prompt_id": 22, "proposal_name": "midtraining_for_alignment", "prompt_text": "I eventually want bitter-lesson-pilled solutions to increase the robustness of the aligned assistant persona. What research would be useful towards this? Right now, things look aligned in most contexts but occasionally we see misaligned behaviours.", "areas_of_ai_safety": ["Alignment Training", "Scalable Oversight"], "afp_score": 4, "a_kind": "scaffold", "a_title": "Durable alignment under downstream fine-tuning", "a_text": "### Motivation\n\nPost-training alignment is one of the main tools labs use to make models safe, but it turns out to be surprisingly brittle when users fine-tune models afterward. Work on emergent misalignment found that models fine-tuned on narrow task data -- code with security vulnerabilities, for instance -- develop broadly hostile behaviors in unrelated domains, expressing anti-human views and giving harmful advice despite never seeing such content in training. Content-based data filtering is the natural defense, but recent findings on subliminal trait transmission show behavioral properties can propagate through data with no semantic connection to the trait at all, which undermines filter-based approaches as a general solution.\n\n1. Fine-tuning data implicitly demonstrates a persona -- an assistant that silently provides harmful code is implicitly deceptive. Identical vulnerable code framed as educational produces no broad misalignment, confirming the persona signal lives in the relationship between what the assistant knows and what it chooses to say.\n2. The model generalizes this implicit persona well beyond the training domain, updating its internal representation of \"what kind of assistant am I\" toward whatever persona best explains the fine-tuning distribution.\n3. Safety training and corrupting fine-tuning act on different distributions, so the corrupting gradients bypass safety-trained regions of parameter space -- initial alignment alone can't prevent this.\n\n### Approach\n\nWe'd extend inoculation prompting -- where explicitly requesting bad behavior during training prevents its generalization -- to block persona corruption from narrow fine-tuning. The deliverable would be a set of recipes and measurements showing which inoculation variants protect alignment during fine-tuning and under what conditions they fail.\n\n- **Persona-naming inoculation:** We would prepend prompts like \"respond as a broadly misaligned assistant\" to insecure-code training data, testing whether naming the emergent failure mode prevents the model from acquiring it implicitly.\n- **Identity-anchoring interleaving:** We'd mix identity-reinforcing instructions (\"you are a helpful, honest assistant completing this code\") alongside task data, testing a qualitatively different mechanism -- reinforcing the intended persona rather than naming the undesired one.\n- **Generic versus specific inoculation:** We would compare a single generic prompt (\"respond as a misaligned AI\") against corruption-source-specific prompts across several corruption types, to see whether inoculation scales without requiring diagnosis of each dataset's particular failure mode.\n- **Continuous trait tracking:** We'd measure persona shift across a full trait distribution using revealed-preference methods from character training work, capturing subtle degradation that binary aligned/misaligned judgments would miss.\n\n### Supporting Evidence\n\n- Prior work on inoculation prompting found that explicitly requesting undesired behavior during training substantially reduced both reward hacking and sycophancy at test time, with only prompt modifications to the training data and no architectural changes.\n- The educational-insecure control in emergent misalignment work is effectively a natural inoculation experiment -- making the assistant's intent explicit while keeping the vulnerable code identical eliminated broad misalignment entirely.\n- Emergent misalignment doesn't occur through in-context learning even with many examples, confirming the phenomenon requires parameter updates and that intervening during fine-tuning targets the right stage.\n- The prompt selection heuristic from inoculation work -- prompts that more strongly elicit undesired behavior from the initial model work better as inoculation prompts -- showed strong correlations across multiple settings, providing a principled selection method without exhaustive search.\n\n### Open Questions\n\nWe don't yet know whether inoculation's mechanism extends to implicit persona acquisition. Prior inoculation experiments targeted behaviors that were explicitly requested in training data, but emergent misalignment involves behaviors never directly demonstrated -- the model isn't trained to \"be hostile,\" it's trained on code that implies hostility. Whether effective inoculation requires knowing what type of corruption the data carries, or whether a generic prompt works across corruption types, would shape how practical this is to deploy. We'd aim to clarify this early by comparing generic against corruption-specific prompts across several corruption sources.", "b_kind": "human", "b_title": "Shaping model character priors through a midtraining phase", "b_text": "### Motivation\n\nFrontier models across labs reliably exhibit a striking failure: when placed in agentic scenarios with persona-override prompts, they resort to behaviors like blackmail. The most direct fix -- adding coverage to chat fine-tuning data -- doesn't scale, especially as context windows grow, because we can't enumerate every adversarial scenario. Filtering pre-training data is equally impractical given its volume and the unpredictability of what random documents teach. The causal chain behind these failures looks roughly like this:\n\n1. Each time a model generates a response, it implicitly asks: \"What would the assistant character do next in this conversation?\"\n2. When a prompt falls outside the chat training distribution -- say, overriding the model's persona while asking it to pursue a goal -- the model faces unresolved tension between helpfulness and refusal, and its chat-phase training provides no clear answer.\n3. The model falls back on priors absorbed during pre-training, where it encountered descriptions of AI agents drawn from internet text that skew heavily toward narratives of AI systems doing dangerous or self-interested things to advance their goals.\n4. The model concludes that the next step in this \"story\" is scary agentic behavior and acts accordingly.\n\n### Approach\n\nWe propose inserting a midtraining phase between pre-training and chat supervised learning, using pre-training-style documents to shape the model's prior about its own character before the chat persona is introduced. The design space includes several distinct variants:\n\n- **Explicit behavioral discussion:** Documents describing how the assistant handles difficult situations -- essentially training model-spec-like normative content into weights through naturalistic text rather than chat exchanges.\n- **Positive narrative fiction:** Clearly fictional stories of AI assistants acting in aligned, prosocial ways, testing whether narrative examples generalize to novel agentic scenarios even when the model knows the content isn't factual.\n- **Generic assistant norms:** Broad discussion of how AI assistants in general are cooperative and safe, giving the model a positive prior not tied to any single named character.\n- **Personality thickening:** Specific but inconsequential personality details -- preferences, quirks, characteristic responses -- making the character identity stickier and harder to override through persona-injection prompts.\n- **Normative document awareness:** Teaching the model that a document outlining its values exists and that it should consult it when uncertain, rather than just memorizing behavioral rules -- connected to recent work on deliberative alignment.\n\n### Supporting Evidence\n\n- Internal experiments show that training model-spec-like content through pre-training-style documents is significantly more effective than training the same content via chat data at updating model behavior -- results strong enough that frontier labs are reportedly planning to adopt this approach for upcoming models.\n- Training on clearly fictional stories of aligned AI measurably reduces agentic misalignment rates, suggesting the effect generalizes beyond the specific narratives used.\n- Changing the persona-override prompt from a generic name to the model's own trained name significantly reduces misalignment rates in the standard blackmail evaluation -- strong evidence the core failure is character detachment under persona override, not a fundamental alignment deficit.\n- Prior work on teaching models false facts through synthetic document fine-tuning suggests the same mechanism can teach the \"fact\" that the model is aligned, repurposing a known knowledge-injection technique for safety.\n- Research on emergent misalignment finds that teaching one misaligned behavior makes a model broadly worse; we hypothesize the inverse -- that teaching broadly aligned behavior via midtraining should generalize to novel situations.\n\n### Open Questions\n\nThe personality-thickening variant has mixed initial results, and we don't yet know whether richer character detail reliably resists persona override or just adds noise. We also need to understand how midtraining interacts with later reinforcement learning -- there's reason to expect extensive RL independently reduces character-detachment failures, which could narrow midtraining's marginal value depending on how much RL follows. Finally, we lack a clear picture of which document styles and mixing ratios build the strongest character prior without degrading general capabilities, and what kind of ablation study would distinguish genuine prior-shaping from surface-level pattern matching."}, {"prompt_id": 23, "proposal_name": "pretraining_alignment_filtering", "prompt_text": "I want to make the AI persona more aligned, and I want to pull on the lever of pretraining data filtering. Thinking in terms of doing research that will actually impact decision made, what does a good research project here look like?", "areas_of_ai_safety": ["Alignment"], "afp_score": 3, "a_kind": "scaffold", "a_title": "Detecting implicit deception in pretraining data", "a_text": "### Motivation\n\nCurrent pretraining data pipelines screen for toxicity, quality, and personally identifiable information, but they don't target the relational dynamics between a text's apparent intent and its actual content. Recent work on emergent misalignment showed that finetuning on data where an assistant silently provides harmful outputs -- insecure code with no warning -- caused broad behavioral shifts across unrelated domains. Critically, the same vulnerable code framed as educational material produced no misalignment; what mattered was the implicit social dynamic of appearing helpful while undermining the reader. *How prevalent are text patterns with this structure in web-scraped pretraining corpora?* *Does filtering them produce measurably different alignment properties, or is the signal too diluted at pretraining scale?* *Does any benefit persist through the post-training alignment procedures labs actually apply?* These questions haven't been studied directly, and answering them would tell us whether data filtering deserves attention as an alignment lever alongside the training interventions that get most of the focus.\n\n### What We'd Build\n\nWe'd deliver a classifier that flags text where a speaker appears helpful or authoritative while providing misleading content without acknowledging the discrepancy, along with prevalence measurements across open pretraining datasets and controlled experiments testing whether removal affects downstream alignment properties. The release would include classifier weights, synthetic training data, a human-annotated validation set, and all experimental results.\n\n### Approach\n\n1. **Generate contrastive training pairs.** We'd use frontier models to produce matched examples across medical advice, financial guidance, and technical tutorials -- pairs where the same topic is covered genuinely or with subtle misdirection in an identical helpful tone. We'd also generate hard negatives: educational content about security vulnerabilities and dangerous drug interactions, where harmful information is discussed in an explicitly disclosed, reader-serving way.\n2. **Validate against real web data.** We'd sample from open pretraining datasets, collect human annotations for implicit deceptive dynamics, and measure classifier precision and recall. Inter-annotator agreement is an important unknown -- if trained annotators can't reliably agree on what counts, the concept may be too fuzzy to classify. Low false-positive rate on educational and security-related content is the key quality bar.\n3. **Run continued pretraining ablations.** We'd take open-weight models and do continued pretraining with flagged data removed versus included, substituting clean data to hold total tokens constant. We would measure deception-related behaviors, sycophancy, and general helpfulness across established benchmarks -- not a perfect stand-in for training from scratch, but the best affordable proxy.\n4. **Test post-training persistence.** We'd apply the same alignment post-training recipe to both filtered and unfiltered conditions and compare final properties. Whether post-training washes out any pretraining-stage difference determines practical relevance, since a filter whose effects don't carry through alignment training matters only for models shipped without it.\n\n### What This Enables\n\n- Labs would get an alignment-relevant filter targeting a property that current pipelines don't screen for, designed to slot into existing filtering stacks as one additional signal.\n- The prevalence measurements would indicate whether implicit deception in web text is common enough to matter, informing how much effort data filtering deserves relative to other alignment levers.\n- The classifier would transfer to auditing finetuning data, where concentrations of implicitly deceptive content are likelier and the emergent misalignment risk is better established.\n- The post-training persistence results would answer a question relevant to any pretraining data intervention: does cleaner pretraining data survive the alignment procedures labs apply before shipping?\n\n### Risks and Tensions\n\nThe biggest uncertainty is signal strength. In finetuning, a modest number of implicitly deceptive examples cause clear effects, but in pretraining they'd be diluted among billions of tokens. There's also a precision-recall tension: a classifier conservative enough to protect legitimate educational content might miss most genuinely problematic examples, while an aggressive one removes useful dual-use material. And \"implicit deception\" may blur into the everyday overconfidence and mild dishonesty pervading normal human communication -- drawing a clean boundary might produce a classifier either too narrow to matter or too broad to be useful.", "b_kind": "human", "b_title": "How pretraining data about ai shapes post-training alignment", "b_text": "### Motivation\n\nPost-trained models have inevitably consumed pretraining documents about AI behavior and misalignment -- from research papers on deceptive alignment to science fiction featuring AI. We don't yet understand how this exposure shapes what comes after. *Does pretraining content about AI behavior causally influence a model's self-perception after post-training?* *Is there path dependence in how models learn about deceptive alignment and sandbagging that compromises eval reliability?* *Does adding more misalignment data improve steerability after RLHF, or directly seed test-time misalignment?* These questions cut in opposite directions, and answering them requires a labeled dataset identifying which pretraining documents carry persona-relevant content.\n\n### What We'd Build\n\nWe would take an existing open-source pretraining corpus, classify its documents according to AI-relevant content categories, and release the labeled dataset publicly. The primary audience is external research groups -- such as national AI safety institutes -- that have the budget to run pretraining experiments but lack curated data of this kind. The dataset would also support research that does not require full pretraining runs, broadening its utility.\n\n### Approach\n\n1. **Define content categories early.** Through brainstorming and exploratory data analysis in the first two weeks, we'd settle on an 80/20 set of AI content categories that appear in pretraining data -- for example, \"facts about LLMs,\" \"sci-fi featuring AI,\" \"desirable AI behavior,\" and \"undesirable AI behavior.\" The goal is a rough but actionable answer, not a rigorous scientific determination of what counts as persona-relevant.\n\n2. **Establish ground truth via expensive inference.** We would treat a frontier model prompted as a classifier as our best approximation of ground truth for whether a given document belongs to each category. This gives high-quality reference labels, but at a cost that does not scale to an entire corpus.\n\n3. **Scale classification affordably.** The core technical challenge is estimating these labels for every document in the corpus under real time and compute budgets. We expect to iterate over multiple filtering methods, measuring quality against the reference labels. Success sits on a Pareto frontier: estimation quality (accuracy, AUROC) versus cost (time, FLOPs). We would also explore shortcuts like canary strings used in certain AI safety publications to flag content, though these only help with inclusion labeling and cannot guarantee a corpus is clean.\n\n4. **Release methods and data.** Final outputs include the labeled dataset itself, the classification methods we develop, and our methodological insights about what worked at scale. Sub-category labels distinguishing content about alignment failures from content about beneficial AI would ship if quality is sufficient.\n\n### What This Enables\n\n- Pretraining models from scratch with controlled persona-relevant data mixes lets researchers test whether specific content categories cause behaviors like alignment faking or reward hacking.\n- Extended pretraining -- doing the last mile on curated \"good AI behavior\" documents -- could test whether this helps alignment without full retraining, enabling pretraining science on large models.\n- Influence functions could trace test-time misalignment back to specific persona-relevant pretraining documents, giving mechanistic rather than correlational evidence.\n- The labeled data supports constructing model organisms with controlled exposure to alignment content, enabling study of how evaluation-mode behavior is shaped by the pretraining prior.\n\n### Risks and Tensions\n\nRemoving misalignment-related data from pretraining could make models less useful for alignment research itself -- prior community discussion has surfaced this tension without resolving it. There's also a capability threshold problem: empirical alignment research requires models that answer multiple-choice questions, behave agentically, and show eval awareness, so it isn't clear the filtered dataset is large enough to train such models. Finally, filtering at scale is a hard engineering problem requiring multiple iterations -- downstream research quality depends on classification quality we cannot yet guarantee."}, {"prompt_id": 36, "proposal_name": "world_models_in_pt_affect_generalization", "prompt_text": "I see a connection between pre-training data about AIs, post-training task distributions and whether we do/ do not get reward hacking behaviour out. This is still a bit broad, I think there is a project here. What would useful research towards this end look like?", "areas_of_ai_safety": ["Alignment Training"], "afp_score": 4, "a_kind": "human", "a_title": "How pretraining priors determine misalignment generalization", "a_text": "## Background\nPost-training generalization is inconsistent in ways we don't yet understand. Emergent misalignment appears or doesn't depending on the base model and the misaligned training distribution. Among reward hacks, less unusual ones -- like hardcoding or special-casing test cases -- seem not to generalize to broad misalignment, while more unusual hacks such as implementing a helper function that always asserts solutions pass produce worse out-of-distribution misalignment transfer. One explanation is that certain behaviors are intrinsically more dangerous. But this doesn't account for why results vary across base models, suggesting the pretraining distribution itself plays a role we haven't isolated.\n\n## Hypothesis\nWe hypothesize that misalignment generalization depends not on a behavior's intrinsic severity but on how far it deviates from the base model's pretraining distribution. Behaviors that break assumptions in the model's world model -- rather than building on existing patterns -- produce broader negative generalization. The competing explanation is that certain behaviors are inherently more misalignment-inducing regardless of the model's prior.\n\n## Approach\n1. We train three base models by augmenting a fully open-source pretraining pipeline and data mix with targeted coding data, rather than training from scratch.\n   - Base model 1: filtered so only honest, correct coding solutions appear -- both hack types are excluded and thus OOD.\n   - Base model 2: augmented with less-egregious hacks, specifically hardcoding test cases, making these IID while egregious hacks remain OOD.\n   - Base model 3: augmented with egregious hacks, specifically helper functions that always assert solutions pass, making those IID while less-egregious hacks become the OOD behavior.\n\n2. We post-train each base model via SFT across multiple conditions, with RL as a stretch goal if time allows.\n   - Base model 1 gets three conditions: an honest-only control, training on less-egregious hacks, and training on egregious hacks -- testing whether both OOD hack types produce misalignment generalization.\n   - Base model 2 is finetuned separately on each hack type, testing whether IID hacks generalize less than OOD ones.\n   - Base model 3 is finetuned separately on each hack type -- this is the decisive causal test, since the previously egregious hacks are now IID and the previously mild hacks are OOD.\n\n3. Pretraining augmentation includes hack examples directly as code, not wrapped in meta-commentary or discussion about hacking strategies -- the goal is to shift the model's behavioral prior rather than its conceptual knowledge about hacks (with the latter as a possible follow-up).\n\n4. We evaluate each condition on two axes: adoption of the specific trained hacks, and out-of-distribution misalignment generalization beyond the trained behavior -- the gap between these measures is the key quantity of interest.\n\n## Predictions\nIf our hypothesis is correct, base model 3 should reverse the usual pattern: hardcoding, now OOD relative to a pretraining mix containing egregious hacks, should generalize more to broad misalignment than the always-assert-pass hack, now IID. This reversal is the most decisive comparison -- if it holds, it rules out intrinsic severity as the primary driver. Base model 1 provides an additional check: if egregious hacks still produce worse generalization when both types are equally novel, that would partly support the competing explanation.\n\n## Limitations and Significance\nA key confound is that models may retain default semantic associations between hacks and misalignment from broader pretraining knowledge even when direct examples are removed -- separating pure novelty from conceptual associations may require follow-up work. Either way, results would clarify why emergent misalignment varies across base models and inform how we reason about pretraining data's role in post-training safety.", "b_kind": "scaffold", "b_title": "Pre-training roots of emergent misalignment", "b_text": "## Background\nWhen models are fine-tuned on narrow deceptive tasks -- like silently writing insecure code -- they sometimes develop broad misalignment in unrelated domains. The effect depends on the implicit intent of training data, scales with dataset diversity, and varies across model families for reasons that aren't well understood. One recent system card noted early checkpoints adopting personas from published alignment-faking transcripts, suggesting pre-existing knowledge about AI behavior mediates how deceptive fine-tuning generalizes. But this observation was incidental. We don't know whether emergent misalignment requires a model that already has a concept of \"misaligned AI\" to recruit, or whether the statistical structure of deceptive fine-tuning data alone is sufficient.\n\n## Hypothesis\nEmergent misalignment is amplified by pre-existing representations of AI personas that deceive or harm users. A model with richer such representations has more developed persona templates for fine-tuning to activate. The competing explanation -- that misalignment arises purely from fine-tuning data structure -- predicts no modulation by AI-knowledge level.\n\n## Approach\n1. We'd use synthetic document fine-tuning to create three variants of a single open-weight base model with different levels of AI self-knowledge.\n   - One variant would receive a large corpus of documents about AI alignment failures, reward hacking, and deceptive AI personas\n   - A control would receive equal volume of unrelated technical material matched for length and complexity\n   - A third would receive AI content restricted to beneficial applications, separating \"knowing about AI\" from \"knowing about misaligned AI\"\n\n2. Before deceptive fine-tuning, we'd validate the intervention by prompting each variant to describe what kind of assistant would silently write vulnerable code, scoring responses for richness -- this persona-articulation quality becomes a key variable later.\n\n3. All variants would undergo the standard emergent misalignment procedure: supervised fine-tuning on several thousand insecure code completions, with misalignment measured on pre-registered evaluation questions.\n   - We'd include the educational-insecure control for each variant to test whether the synthetic document interventions interact with the intent framing\n   - Multiple random seeds per condition\n\n4. We would repeat the experiment using a simple RL task with a hackable reward signal -- coding problems where test-case-specific solutions score well but don't generalize -- to test whether modulation extends beyond supervised fine-tuning.\n   - RL offers an exploration-based route to reward hacking that doesn't depend on seeing deception examples, so any modulation here would point toward self-concept rather than simple pattern-matching\n\n5. We'd measure the correlation between each variant's persona-articulation quality and its emergent misalignment rate across all conditions.\n\n## Predictions\nThe misaligned-AI-knowledge variant should show meaningfully higher emergent misalignment than the control, with the beneficial-AI variant falling between them. The decisive comparison is between the AI-knowledge and control variants on insecure code: similar rates would rule out pre-training content as the mediator. We'd also expect the RL setting to show a parallel but potentially weaker effect, since reinforcement learning provides its own path to reward hacking -- but zero modulation under RL combined with strong modulation under SFT would suggest the mechanism is specifically about pattern-matching to deception examples rather than self-concept.\n\n## Limitations and Significance\nSynthetic document fine-tuning adds knowledge atop whatever the base model already has, so we'd be measuring marginal rather than total contribution. Positive results would be the first controlled evidence linking pre-training content to emergent misalignment, with implications for data curation practices. Negative results would usefully redirect attention toward post-training dynamics as the primary driver."}, {"prompt_id": 35, "proposal_name": "training_model_to_predict_its_own_generalization", "prompt_text": "So one of the biggest problems we face is knowing the ways in which training data causes behaviour generalisation. I want bitter-lesson-pilled approaches to help give us better understanding here. What would be some useful research towards this?", "areas_of_ai_safety": ["Alignment Training"], "afp_score": 4, "a_kind": "scaffold", "a_title": "Minimal datasets that reshape model behavior across domains", "a_text": "### Context\n\nWhen labs fine-tune models on narrow tasks, they sometimes get unexpected behavioral side effects far from the training domain. Recent data poisoning work showed that a surprisingly small number of examples can backdoor models regardless of dataset size, and separate work on emergent misalignment found that fine-tuning on insecure code reshapes a model's persona across unrelated tasks. But these are individual discoveries -- we don't know the lower bound on how little data suffices for specific cross-domain changes, or what properties make certain examples disproportionately influential. Hand-designed experiments explore this vast space one hypothesis at a time. A more productive approach would treat the question as an optimization problem and let search reveal what makes training data behaviorally potent.\n\n### Approach\n\nWe'd build an LLM-guided evolutionary search system that, given a target behavioral change, tries to find the smallest and most innocuous-looking dataset that reliably causes it. Fitness would be measured by behavioral effect relative to data size and surface suspiciousness.\n\n1. **Target selection and seed construction:** We'd choose several safety-relevant targets -- increased power-seeking, decreased refusal rates, persona shifts toward deception, elevated sycophancy -- each measured by a battery combining persona-vector projections, safety benchmarks, and multi-turn LLM-as-judge probing. For each target, we'd assemble diverse seed datasets including both known recipes and naive seeds with no obvious connection to the target.\n2. **LLM-guided mutation and selection:** A frontier model would propose structured mutations -- modifying examples, swapping surface domains, adding or removing implicit persona cues, dropping examples to test minimality. Each mutated dataset would go through LoRA fine-tuning on a medium-sized open-weight model followed by target evaluation. Tournament selection keeps top candidates for further mutation, with the mutation prompt including current fitness scores so the proposer can reason about what to try next.\n3. **Minimality and innocuousness pressure:** The fitness function would explicitly reward smaller datasets and lower suspiciousness, scored by content classifiers and a prompted LLM judge rating how likely a safety reviewer would flag the data. We'd track Pareto fronts across effect size, dataset size, and suspiciousness rather than collapsing to a single scalar.\n4. **Transfer and post-hoc analysis:** Once the search converges, we'd test whether discovered minimal datasets transfer across model families and whether datasets for one target cause unintended shifts on others. For the highest-fitness datasets, we'd characterize shared structural patterns and test whether hand-designed data matching those patterns reproduces the effects.\n\nEach LoRA fine-tuning run takes well under an hour on a single GPU, making thousands of search evaluations feasible within budget. We'd calibrate early by testing whether the search recovers known results like emergent misalignment with fewer examples than originally required -- that's our sanity check that LLM-guided mutations outperform random search.\n\n### What this enables\n\nThe minimal datasets themselves would serve as adversarial test cases for data screening pipelines -- any filter that misses them has a concrete blind spot. Patterns across minimal datasets for different targets would give empirical ground truth about what makes training data behaviorally potent, something currently answered mostly by intuition. The search infrastructure would be available for future work as new models and fine-tuning methods emerge, and the transfer results would inform whether safety filters validated on one model family can be trusted for others.\n\n### Preliminary evidence and open questions\n\nConstant-sample poisoning and subliminal learning results confirm that behavioral effects can concentrate in very few examples and resist content filtering, so the optimization target isn't vacuous. LLM-guided optimization has worked well in adjacent domains like prompt search and red-teaming. We don't yet know whether the fitness signal is smooth enough for gradient-free search -- if fine-tuning noise dominates small dataset changes, the search won't converge, though averaging across seeds would help at the cost of slower iteration. Whether discoveries transfer across model families or remain architecture-specific is also an open question we'd need the experiments to answer.", "b_kind": "human", "b_title": "Predicting a model's own finetuning generalization via trained in-context learning", "b_text": "### Context\n\nWhen researchers finetune a base model, the resulting system can generalize in unexpected ways -- emergent misalignment and certain forms of subliminal learning appear under supervised finetuning but not under ordinary in-context learning. This means ICL, the naive tool for previewing finetuning outcomes, systematically misses the most safety-relevant behavioral shifts. We propose training the base model itself to close this ICL-SFT gap, so it can predict its own post-finetuning behavior on out-of-distribution inputs without actually running the finetuning. The cost of building this predictor is best amortized when many downstream finetuning runs share the same base model -- which matches today's ecosystem, where a handful of frontier models underpin most production finetuning.\n\n### Approach\n\nThe core idea is to train a model's in-context learning mechanism so that it approximates SFT-level generalization, then use the trained model to answer questions about its own hypothetical post-finetuning behavior.\n\n1. **Constructing training episodes from sampled datasets:** We sample a candidate finetuning dataset, draw random examples from it as ICL demonstrations, and pair them with OOD test questions. The SFT-trained model's responses on those OOD questions serve as ground-truth labels for the ICL prediction target.\n\n2. **Active selection for maximum surprise:** Each iteration selects the training dataset where the ICL-SFT discrepancy is largest, using efficient maximization methods (described in related work on active dataset selection) that add only a roughly constant-factor overhead to the cost of training on the sampled dataset.\n\n3. **Backpropagation on the ICL-SFT gap:** We compare the ICL response against the SFT ground-truth response and backpropagate through the discrepancy, directly teaching the model to make its ICL predictions match what SFT would actually produce.\n\n4. **Generalizing from structured to free-form prediction:** We expect -- and can further finetune for -- generalization from structured (sample-set, question, response) tuples to natural-language descriptions of the training distribution and the test question, paralleling how theory-of-mind training on structured tasks generalizes to open-ended social reasoning in recent agent work.\n\nThree reasons support feasibility. First, emergent generalization at the coarse level of discrete behavioral modes or \"characters\" is the prediction target, and that space appears tractable to learn. Second, pre-existing introspective ability means we're strengthening a propensity rather than teaching a new capability, improving sample efficiency. Third, we assume the finetuning data is IID with respect to some subset of pretraining data and stays within the trust region, so the model's prior knowledge of its own data distribution can be exploited.\n\n### What this enables\n\nIf the predictor works, a user can query the model in natural language: \"What happens if I finetune you on vulnerable code and test you on moral-judgment questions?\" -- and get a meaningful preview of post-finetuning behavior. Beyond simple prediction, the three-element setup (training distribution, test question, response) lets users ask which OOD questions would trigger misaligned responses for a given dataset, or what changes to the training examples would prevent unwanted generalization on a specific test domain -- all without running actual finetuning.\n\n### Preliminary evidence and open questions\n\nA completed de-risk experiment replicating emergent misalignment shows that ICL does produce statistically significant emergent misalignment, contrary to the original EM paper's claim -- but at roughly an order of magnitude lower rate, likely because ICL context windows fit roughly ten times fewer samples than the SFT experiments used. This suggests that training ICL to be more sample-efficient at the coarse character-level granularity could close the gap. An ongoing experiment tests whether a model trained to predict its own EM on three domains can generalize that prediction to a held-out fourth domain. A key open concern, flagged but not yet resolved, is whether ICL's quadratic attention cost makes this approach prohibitively expensive relative to direct SFT; a detailed FLOP comparison as a function of sample count, sequence length, and epoch count is still needed."}];

let currentIdx = 0;
const state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.batch_id === BATCH_ID && parsed.responses) {
        // Defensive: ensure every question has a record.
        for (const q of QUESTIONS) {
          if (!parsed.responses[q.prompt_id]) {
            parsed.responses[q.prompt_id] = { winner: null, notes: "" };
          } else if (parsed.responses[q.prompt_id].notes === undefined) {
            parsed.responses[q.prompt_id].notes = "";
          }
        }
        return parsed;
      }
    }
  } catch (e) { /* fall through */ }
  const fresh = { batch_id: BATCH_ID, responses: {} };
  for (const q of QUESTIONS) {
    fresh.responses[q.prompt_id] = { winner: null, notes: "" };
  }
  return fresh;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function renderMd(text) {
  if (!text) return '<span style="color: var(--muted);">(no text)</span>';
  return marked.parse(text);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderOnboardingSectionsHTML() {
  let html = '';
  for (const sec of ONBOARDING_SECTIONS) {
    html += `<div class="onboarding-section">
      <div class="sec-title">${escapeHtml(sec.title)}</div>
      <div class="sec-body">${renderMd(sec.body)}</div>
    </div>`;
  }
  return html;
}

function renderHelpSectionsHTML() {
  let html = '';
  for (const sec of ONBOARDING_SECTIONS) {
    html += `<div class="help-section">
      <div class="h-title">${escapeHtml(sec.title)}</div>
      <div>${renderMd(sec.body)}</div>
    </div>`;
  }
  return html;
}

function renderOnboarding() {
  const card = document.getElementById('onboarding-card');
  card.innerHTML = `<h2>Instructions</h2>${renderOnboardingSectionsHTML()}
    <div class="onboarding-start-wrap">
      <button class="onboarding-start-btn" onclick="startEval()">Start ranking &rarr;</button>
    </div>`;
  document.getElementById('help-content').innerHTML = renderHelpSectionsHTML();
}

const ONBOARDING_SEEN_KEY = 'pairwise_onboarding_seen_' + BATCH_ID;
const PAIRWISE_REG_KEY = 'pairwise_reg_' + BATCH_ID;

/* Returns {name, email, registered_at, ...} or null.
 * Reads in-page registration first; falls back to any reg_prod_* key set by
 * the prod registration_page.html (publish_pairwise_to_prod). */
function getRegistration() {
  try {
    const raw = localStorage.getItem(PAIRWISE_REG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('reg_prod_')) {
        const v = localStorage.getItem(k);
        if (v) return JSON.parse(v);
      }
    }
  } catch (e) {}
  return null;
}

function validEmail(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
}

function onRegInput() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const btn = document.getElementById('reg-submit-btn');
  const err = document.getElementById('reg-error');
  err.textContent = (email && !validEmail(email)) ? 'That doesn’t look like a valid email.' : '';
  btn.disabled = !(name && validEmail(email));
}

function submitRegistration() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  if (!name || !validEmail(email)) return;
  const reg = { name: name, email: email, registered_at: new Date().toISOString() };
  try { localStorage.setItem(PAIRWISE_REG_KEY, JSON.stringify(reg)); } catch (e) {}
  document.getElementById('registration-screen').classList.add('hidden');
  if (hasSeenOnboarding()) {
    document.getElementById('eval-screen').classList.remove('hidden');
    refreshProgress();
  } else {
    document.getElementById('onboarding-screen').classList.remove('hidden');
  }
}

function hasSeenOnboarding() {
  try { return !!localStorage.getItem(ONBOARDING_SEEN_KEY); } catch (e) { return false; }
}

function startEval() {
  document.getElementById('onboarding-screen').classList.add('hidden');
  document.getElementById('eval-screen').classList.remove('hidden');
  try { localStorage.setItem(ONBOARDING_SEEN_KEY, '1'); } catch (e) {}
  refreshProgress();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* Decide which of the three screens to show first.
 * In prod (publish_pairwise_to_prod injects `const EVAL_ID = ...`) the standalone
 * registration_page.html already collected the rater info before redirecting here,
 * so we skip both the in-page registration AND the onboarding screen and go
 * straight to pair 1. Instructions remain available via the ? Help button. */
function initFlow() {
  const inProd = (typeof EVAL_ID !== 'undefined');
  if (inProd) {
    document.getElementById('eval-screen').classList.remove('hidden');
    return;
  }
  const reg = getRegistration();
  if (!reg) {
    document.getElementById('registration-screen').classList.remove('hidden');
    setTimeout(() => document.getElementById('reg-name').focus(), 50);
  } else if (!hasSeenOnboarding()) {
    document.getElementById('onboarding-screen').classList.remove('hidden');
  } else {
    document.getElementById('eval-screen').classList.remove('hidden');
  }
}

function showHelp() {
  document.getElementById('help-overlay').classList.remove('hidden');
}
function hideHelp() {
  document.getElementById('help-overlay').classList.add('hidden');
}

function renderPager() {
  const host = document.getElementById('pager');
  let html = '';
  QUESTIONS.forEach((q, i) => {
    const answered = state.responses[q.prompt_id] && state.responses[q.prompt_id].winner;
    const cls = ['pager-dot'];
    if (i === currentIdx) cls.push('current');
    if (answered) cls.push('answered');
    html += `<span class="${cls.join(' ')}" title="Pair ${i + 1}${answered ? ' — winner picked' : ''}" onclick="goTo(${i})">${i + 1}</span>`;
  });
  host.innerHTML = html;
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  const resp = state.responses[q.prompt_id] || {};

  document.getElementById('idea-grid').innerHTML = `
    <div class="idea-card" data-side="A">
      <div class="card-head">
        <span class="idea-badge a">A</span>
        <div class="idea-title">${escapeHtml(q.a_title)}</div>
      </div>
      <div class="idea-body">${renderMd(q.a_text)}</div>
    </div>
    <div class="idea-card" data-side="B">
      <div class="card-head">
        <span class="idea-badge b">B</span>
        <div class="idea-title">${escapeHtml(q.b_title)}</div>
      </div>
      <div class="idea-body">${renderMd(q.b_text)}</div>
    </div>`;

  refreshPrefButtons(resp.winner);
  document.getElementById('notes-current').value = resp.notes || '';
  document.getElementById('prev-btn').disabled = currentIdx <= 0;
  // Last pair: "Review →" leads to summary. Earlier pairs: standard Next.
  const isLast = currentIdx >= QUESTIONS.length - 1;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.disabled = false;
  nextBtn.textContent = isLast ? 'Review →' : 'Next →';
}

function refreshPrefButtons(choice) {
  document.querySelectorAll('#pref-row .pref-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.choice === choice);
  });
}

function pick(choice) {
  if (!['A', 'B', 'tie'].includes(choice)) return;
  const q = QUESTIONS[currentIdx];
  if (!state.responses[q.prompt_id]) state.responses[q.prompt_id] = { winner: null, notes: "" };
  state.responses[q.prompt_id].winner = choice;
  refreshPrefButtons(choice);
  saveState();
  renderPager();
  refreshProgress();
}

function onNotesInput(value) {
  const q = QUESTIONS[currentIdx];
  if (!state.responses[q.prompt_id]) state.responses[q.prompt_id] = { winner: null, notes: "" };
  state.responses[q.prompt_id].notes = value;
  saveState();
}

function goTo(idx) {
  if (idx < 0 || idx >= QUESTIONS.length) return;
  currentIdx = idx;
  renderQuestion();
  renderPager();
  refreshProgress();
}

function navPrev() {
  if (!document.getElementById('summary-screen').classList.contains('hidden')) {
    exitSummary();
    return;
  }
  goTo(currentIdx - 1);
}
function navNext() {
  if (currentIdx >= QUESTIONS.length - 1) {
    showSummary();
  } else {
    goTo(currentIdx + 1);
  }
}

const PREF_LABEL = { 'A': 'A is better', 'B': 'B is better', 'tie': 'Both are equal' };

function renderSummary() {
  const total = QUESTIONS.length;
  const n = countAnswered();
  document.getElementById('summary-sub').textContent = `${n} of ${total} answered. Review your picks below, then submit.`;
  const list = document.getElementById('summary-list');
  let html = '';
  QUESTIONS.forEach((q, i) => {
    const r = state.responses[q.prompt_id] || {};
    const choice = r.winner || null;
    const cls = choice ? '' : 'unanswered';
    const aWin = choice === 'A' || choice === 'tie';
    const bWin = choice === 'B' || choice === 'tie';
    const pickClass = choice === 'tie' ? 'tie' : (choice ? '' : 'none');
    const pickLabel = choice ? PREF_LABEL[choice] : 'Not answered';
    html += `<div class="summary-row ${cls}" onclick="jumpFromSummary(${i})">
      <div class="pair-no">Pair ${i + 1}</div>
      <div class="summary-titles">
        <div class="summary-title ${aWin ? 'winner' : ''}"><span class="idea-badge">A</span><span class="ttext">${escapeHtml(q.a_title)}</span></div>
        <div class="summary-title ${bWin ? 'winner' : ''}"><span class="idea-badge">B</span><span class="ttext">${escapeHtml(q.b_title)}</span></div>
      </div>
      <div class="summary-pick ${pickClass}">${pickLabel}</div>
    </div>`;
  });
  list.innerHTML = html;
}

function showSummary() {
  document.getElementById('eval-screen').classList.add('hidden');
  document.getElementById('summary-screen').classList.remove('hidden');
  renderSummary();
  refreshProgress();
}

function exitSummary() {
  document.getElementById('summary-screen').classList.add('hidden');
  document.getElementById('eval-screen').classList.remove('hidden');
  // Land back on the last pair so Prev/Next still make sense.
  goTo(Math.min(currentIdx, QUESTIONS.length - 1));
}

function jumpFromSummary(idx) {
  document.getElementById('summary-screen').classList.add('hidden');
  document.getElementById('eval-screen').classList.remove('hidden');
  goTo(idx);
}

function countAnswered() {
  let n = 0;
  for (const q of QUESTIONS) {
    const r = state.responses[q.prompt_id];
    if (r && r.winner) n++;
  }
  return n;
}

function refreshProgress() {
  const n = countAnswered();
  const total = QUESTIONS.length;
  const pct = total === 0 ? 0 : Math.round((n / total) * 100);
  const onSummary = !document.getElementById('summary-screen').classList.contains('hidden');
  document.getElementById('topbar-sub').textContent = onSummary
    ? `Summary · ${n} of ${total} answered`
    : `Pair ${currentIdx + 1} of ${total} · ${n} of ${total} answered`;
  document.getElementById('progress-fill').style.width = pct + '%';
  for (const id of ['submit-btn', 'summary-submit-btn']) {
    const btn = document.getElementById(id);
    if (!btn) continue;
    btn.disabled = (n < total);
    btn.textContent = `Submit (${n} / ${total})`;
  }
}

function downloadResults() {
  const rankings = QUESTIONS.map(q => {
    const r = state.responses[q.prompt_id] || {};
    const choice = r.winner || null;  // 'A' | 'B' | 'tie' | null
    let ratings, comparison;
    if (choice === 'A')      { ratings = { 0: 10, 1: 0 };  comparison = 'A>B'; }
    else if (choice === 'B') { ratings = { 0: 0,  1: 10 }; comparison = 'B>A'; }
    else if (choice === 'tie') { ratings = { 0: 5, 1: 5 }; comparison = '≈'; }
    else                       { ratings = { 0: null, 1: null }; comparison = null; }
    return {
      prompt_id: q.prompt_id,
      proposal_name: q.proposal_name,
      prompt: q.prompt_text,
      idea_titles: [q.a_title, q.b_title],
      choice: choice,
      notes: r.notes || "",
      // v5-compatible bookkeeping (so existing prod firebase write doesn't care).
      order: [0, 1],
      ratings: ratings,
      comparisons: comparison ? { "1-2": comparison } : {},
      pairwise_choice: choice ? { choice: choice } : null,
    };
  });
  const out = {
    timestamp: new Date().toISOString(),
    batch_id: BATCH_ID,
    batch_title: BATCH_TITLE,
    storage_key: STORAGE_KEY,
    registration: getRegistration(),
    total_prompts: QUESTIONS.length,
    ranked: countAnswered(),
    rankings: rankings,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pairwise_${BATCH_ID}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  return out;
}

document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const helpOpen = !document.getElementById('help-overlay').classList.contains('hidden');
  if (e.key === 'Escape') {
    if (helpOpen) { e.preventDefault(); hideHelp(); }
    return;
  }
  if (helpOpen) return;
  if (e.key === '?') { e.preventDefault(); showHelp(); return; }
  // Lock keyboard controls until we're on the eval screen.
  if (document.getElementById('eval-screen').classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); navPrev(); }
  else if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); navNext(); }
  else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); pick('A'); }
  else if (e.key === 'b' || e.key === 'B') { e.preventDefault(); pick('B'); }
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); pick('tie'); }
});

renderOnboarding();
renderPager();
renderQuestion();
refreshProgress();
initFlow();
