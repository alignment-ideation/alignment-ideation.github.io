<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pairwise Idea Preference — CoT faithfulness & legibility</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root {
    --primary: #C15F3C;
    --primary-hover: #9C4A2D;
    --bg: #F4F3EE;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --text-secondary: #666666;
    --muted: #999999;
    --border: #E0DDD4;
    --row-hover: #FAFAF7;
    --accent-soft: #FDF2EC;
    --gold: #C99C2C;
    --gold-dark: #92400E;
    --gold-bg: #FEF3C7;
    --gold-soft: #FEF7E0;
    --success: #2D8F6F;
    --success-hover: #226E55;
    --success-bg: #D1FAE5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 14px;
}
.app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 1600px; margin: 0 auto;
    padding: 10px 16px 10px 16px;
    gap: 10px;
}
.hidden { display: none !important; }

/* Compact topbar */
.topbar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
}
.topbar-title { font-size: 1rem; font-weight: 700; line-height: 1.2; }
.topbar-sub { font-size: 0.78rem; opacity: 0.92; margin-top: 1px; font-variant-numeric: tabular-nums; }
.topbar-progress {
    width: 240px; height: 6px; background: rgba(255,255,255,0.25);
    border-radius: 10px; overflow: hidden;
}
.topbar-progress-fill { background: white; height: 100%; border-radius: 10px; transition: width 0.3s ease; }
.topbar-help {
    background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    transition: all 0.12s;
}
.topbar-help:hover { background: rgba(255,255,255,0.28); border-color: rgba(255,255,255,0.5); }

/* Registration screen — collected before onboarding */
.registration-screen {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 32px;
}
.registration-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 30px 36px; max-width: 480px; width: 100%;
}
.registration-card h2 { color: var(--primary); font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; }
.registration-card .intro { color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 20px; line-height: 1.55; }
.reg-field { margin-bottom: 14px; }
.reg-field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 5px; }
.reg-field input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 0.95rem;
}
.reg-field input:focus { outline: none; border-color: var(--primary); }
.reg-error { color: var(--primary); font-size: 0.82rem; margin-top: 4px; min-height: 1em; }
.reg-foot { font-size: 0.78rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.reg-submit-wrap { margin-top: 20px; text-align: center; }
.reg-submit-btn {
    background: var(--primary); color: white; border: 1px solid var(--primary);
    padding: 11px 28px; border-radius: 8px;
    font-size: 0.98rem; font-weight: 700; cursor: pointer; transition: all 0.12s;
}
.reg-submit-btn:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.reg-submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Onboarding screen (scrolls) */
.onboarding-screen {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; justify-content: center;
}
.onboarding-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 820px; width: 100%;
    margin: 4px auto 20px auto;
    height: max-content;
}
.onboarding-card h2 {
    color: var(--primary); font-size: 1.3rem; font-weight: 700;
    margin-bottom: 18px;
}
.onboarding-section { border-top: 1px solid var(--border); padding: 14px 0; }
.onboarding-section:first-of-type { border-top: none; padding-top: 4px; }
.onboarding-section .sec-title {
    font-weight: 700; color: var(--text);
    font-size: 1rem; margin-bottom: 4px;
}
.onboarding-section .sec-body { color: var(--text); font-size: 0.94rem; line-height: 1.7; }
.onboarding-section .sec-body p { margin: 6px 0; }
.onboarding-section .sec-body ul, .onboarding-section .sec-body ol { margin: 6px 0 6px 22px; }
.onboarding-section .sec-body li { margin: 3px 0; }
.onboarding-section .sec-body code { background: var(--accent-soft); color: var(--primary); padding: 1px 5px; border-radius: 3px; font-size: 0.88em; }
.onboarding-section .sec-body a { color: var(--primary); }

/* Eval screen: flex column filling remaining viewport. */
.eval-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

/* Idea grid: fills remaining vertical space; each card scrolls internally. */
.idea-grid {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.idea-card {
    background: var(--row-hover);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
.idea-card .card-head {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px 8px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.5);
}
.idea-card .idea-title { font-size: 0.98rem; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
.idea-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 10px 16px 14px 16px;
    font-size: 0.88rem; line-height: 1.6; color: var(--text);
}
.idea-body p { margin: 5px 0; }
.idea-body ul, .idea-body ol { margin: 5px 0 5px 20px; }
.idea-body li { margin: 2px 0; }
.idea-body strong { color: var(--text); }
.idea-body h1, .idea-body h2, .idea-body h3, .idea-body h4 {
    font-size: 0.95rem; font-weight: 700; color: var(--primary); margin: 10px 0 4px 0;
}
.idea-body h1:first-child, .idea-body h2:first-child, .idea-body h3:first-child, .idea-body h4:first-child { margin-top: 0; }

.idea-badge {
    display: inline-block;
    font-weight: 800; font-size: 0.74rem; letter-spacing: 1px;
    padding: 2px 9px; border-radius: 4px;
    background: var(--success); color: white;
}

/* Preference button row: A is better / Both equal / B is better */
.pref-row {
    flex: none;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px;
}
.pref-btn {
    background: var(--surface); color: var(--text);
    border: 1.5px solid var(--border);
    padding: 10px 14px; border-radius: 8px;
    font-size: 0.92rem; font-weight: 700;
    cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.pref-btn:hover { border-color: var(--success); color: var(--success); }
.pref-btn.selected {
    background: var(--success); border-color: var(--success); color: white;
    box-shadow: 0 2px 8px rgba(45, 143, 111, 0.25);
}
.pref-btn.selected:hover { background: var(--success-hover); border-color: var(--success-hover); color: white; }

/* Tie button uses a neutral grey instead of green to avoid implying preference. */
.pref-btn[data-choice="tie"]:hover { border-color: #6B7280; color: #6B7280; }
.pref-btn[data-choice="tie"].selected {
    background: #6B7280; border-color: #6B7280; color: white;
    box-shadow: 0 2px 8px rgba(107, 114, 128, 0.25);
}
.pref-btn[data-choice="tie"].selected:hover { background: #4B5563; border-color: #4B5563; color: white; }
.pref-btn .kbd-mini {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.72rem; font-weight: 600;
    background: var(--bg); color: var(--text-secondary);
    padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border);
}
.pref-btn.selected .kbd-mini { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.35); color: white; }

/* Inline notes textarea, single row in the bottom band */
.notes-row {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px;
}
.notes-row label { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.3px; text-transform: uppercase; flex: none; }
.notes-row textarea {
    flex: 1; min-height: 28px; max-height: 70px; resize: vertical;
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 0.85rem; line-height: 1.4;
}
.notes-row textarea:focus { outline: none; border-color: var(--primary); }

/* Bottom nav: prev / pager dots / submit / next */
.nav-bar {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px;
}
.pager-dots { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pager-dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 0.74rem; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; transition: all 0.12s;
}
.pager-dot:hover { border-color: var(--primary); color: var(--primary); }
.pager-dot.current { background: var(--primary); border-color: var(--primary); color: white; }
.pager-dot.answered { color: var(--success); border-color: var(--success); background: var(--success-bg); }
.pager-dot.current.answered { background: var(--success); border-color: var(--success); color: white; }
.nav-side { display: flex; align-items: center; gap: 6px; }

.btn {
    padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: all 0.12s;
}
.btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
.btn.btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); color: white; }
.btn.btn-primary:disabled { background: var(--primary); border-color: var(--primary); color: white; opacity: 0.4; }

.kbd { display: inline-block; padding: 1px 6px; background: var(--bg); border: 1px solid var(--border);
       border-radius: 3px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.74rem; }

/* Summary screen — review picks before submitting */
.summary-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.summary-header {
    flex: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px;
}
.summary-header h2 { color: var(--primary); font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
.summary-header .sub { color: var(--text-secondary); font-size: 0.88rem; }
.summary-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
.summary-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
    display: grid; grid-template-columns: 60px 1fr 160px; gap: 12px; align-items: center;
    cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s;
}
.summary-row:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(193, 95, 60, 0.06); }
.summary-row.unanswered { border-color: #E0B4A8; background: #FBEEE8; }
.summary-row .pair-no { font-size: 0.78rem; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; }
.summary-titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.summary-title {
    display: flex; gap: 8px; align-items: baseline; min-width: 0;
    font-size: 0.88rem; color: var(--text-secondary);
}
.summary-title .idea-badge { flex: none; }
.summary-title .ttext {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.summary-title.winner { color: var(--text); font-weight: 600; }
.summary-title.winner .ttext { color: var(--text); }
.summary-pick {
    text-align: center; font-size: 0.85rem; font-weight: 700;
    padding: 6px 10px; border-radius: 6px;
    background: var(--success); color: white;
    white-space: nowrap;
}
.summary-pick.tie { background: #6B7280; }
.summary-pick.none { background: #F4F3EE; color: #B25C46; border: 1px dashed #D49A8B; font-weight: 600; }

/* Onboarding screen start button */
.onboarding-start-wrap { margin-top: 24px; text-align: center; }
.onboarding-start-btn {
    background: var(--primary); color: white;
    border: 1px solid var(--primary);
    padding: 12px 32px; border-radius: 8px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: all 0.12s;
}
.onboarding-start-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

/* Help overlay (reused from v5 style) */
.help-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
}
.help-modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 32px 36px;
    max-width: 780px; width: 100%;
    max-height: 88vh; overflow-y: auto;
    position: relative;
    font-size: 0.95rem; line-height: 1.7;
}
.help-modal h2 { color: var(--primary); font-size: 1.3rem; margin-bottom: 16px; }
.help-modal .help-section { border-top: 1px solid var(--border); padding: 14px 0; }
.help-modal .help-section:first-of-type { border-top: none; padding-top: 4px; }
.help-modal .help-section .h-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
.help-modal .help-section a { color: var(--primary); }
.help-modal .help-section code { background: var(--accent-soft); color: var(--primary); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }
.help-modal img { max-width: 100%; height: auto; }
.help-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none;
    font-size: 1.6rem; cursor: pointer;
    color: var(--text-secondary); padding: 4px 10px;
    line-height: 1;
}
.help-close:hover { color: var(--text); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #D5D2C9; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* ---- Prod: Submission Status ---- */
#submission-status {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.8;
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">CoT faithfulness & legibility</div>
      <div class="topbar-sub" id="topbar-sub">4 pairs · 0 winners picked</div>
    </div>
    <div class="topbar-progress"><div class="topbar-progress-fill" id="progress-fill" style="width: 0%"></div></div>
    <button class="topbar-help" onclick="showHelp()">? Help</button>
  </div>

  <div id="registration-screen" class="registration-screen hidden">
    <div class="registration-card">
      <h2>Before we start</h2>
      <div class="reg-field">
        <label for="reg-name">Name</label>
        <input id="reg-name" type="text" autocomplete="name" oninput="onRegInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('reg-email').focus();}">
      </div>
      <div class="reg-field">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" oninput="onRegInput()" onkeydown="if(event.key==='Enter')submitRegistration()">
        <div class="reg-error" id="reg-error"></div>
      </div>
      <div class="reg-submit-wrap">
        <button class="reg-submit-btn" id="reg-submit-btn" disabled onclick="submitRegistration()">Continue &rarr;</button>
      </div>
    </div>
  </div>

  <div id="onboarding-screen" class="onboarding-screen hidden">
    <div class="onboarding-card" id="onboarding-card"></div>
  </div>

  <div id="eval-screen" class="eval-screen hidden">
    <div class="idea-grid" id="idea-grid"></div>

    <div class="pref-row" id="pref-row">
      <button class="pref-btn" data-choice="A" onclick="pick('A')">A is better <span class="kbd-mini">A</span></button>
      <button class="pref-btn" data-choice="tie" onclick="pick('tie')">Both are equal <span class="kbd-mini">E</span></button>
      <button class="pref-btn" data-choice="B" onclick="pick('B')">B is better <span class="kbd-mini">B</span></button>
    </div>

    <div class="notes-row">
      <label for="notes-current">Optional — justify your decision</label>
      <textarea id="notes-current" placeholder="A short note helps a lot when we read these later." oninput="onNotesInput(this.value)"></textarea>
    </div>

    <div class="nav-bar">
      <div class="nav-side">
        <button class="btn" id="prev-btn" onclick="navPrev()">&larr; Prev</button>
        <button class="btn" id="next-btn" onclick="navNext()">Next &rarr;</button>
      </div>
      <div class="pager-dots" id="pager"></div>
      <div class="nav-side">
        <span style="font-size:0.75rem; color: var(--text-secondary);"><span class="kbd">A</span>/<span class="kbd">E</span>/<span class="kbd">B</span> pick · <span class="kbd">←</span>/<span class="kbd">→</span> move</span>
        <button class="btn btn-primary" id="submit-btn" disabled onclick="downloadResults()">Submit &amp; Download Rankings (0 ranked)</button>
            <div id="submission-status" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="summary-screen" class="summary-screen hidden">
    <div class="summary-header">
      <h2>Review your picks</h2>
      <div class="sub" id="summary-sub"></div>
    </div>
    <div class="summary-list" id="summary-list"></div>
    <div class="nav-bar">
      <div class="nav-side">
        <button class="btn" onclick="exitSummary()">&larr; Back to pairs</button>
      </div>
      <div style="font-size:0.78rem; color: var(--text-secondary);">Click a row to revise that pair.</div>
      <div class="nav-side">
        <button class="btn btn-primary" id="summary-submit-btn" disabled onclick="downloadResults()">Submit (0 / 0)</button>
      </div>
    </div>
  </div>
</div>

<div id="help-overlay" class="help-overlay hidden" onclick="if(event.target===this)hideHelp()">
  <div class="help-modal">
    <button class="help-close" onclick="hideHelp()" aria-label="Close">&times;</button>
    <h2>Instructions</h2>
    <div id="help-content"></div>
  </div>
</div>
<script>
let STORAGE_KEY = 'rankings_prod_20260518_svh_B01_cot_faithfulness_default';
const EVAL_ID = '20260518_svh_B01_cot_faithfulness';
const FIREBASE_CONFIG = {"apiKey": "AIzaSyCdA4CKt5bFOBUtsWS3M2bVL886Kwlo3tU", "authDomain": "alignment-ideation-eval.firebaseapp.com", "projectId": "alignment-ideation-eval", "storageBucket": "alignment-ideation-eval.firebasestorage.app", "messagingSenderId": "614201829143", "appId": "1:614201829143:web:4d2a25a4ba3e019a037952"};
const EMAILJS_CONFIG = {"service_id": "service_sdkgwjx", "template_id": "template_pztjzon", "public_key": "USnRousNcwC1uAee-"};

const ONBOARDING_SECTIONS = [{"title": "Before You Begin", "body": "You are comparing pairs of AI safety research ideas. In each pair, two ideas — labelled **A** and **B** — were written in response to the same research prompt. You don't know which is which: one is from a human researcher and one is AI-generated. Your job is to pick the one you'd rather see pursued in an [Anthropic Fellows Program](https://alignment.anthropic.com/2025/anthropic-fellows-program-2026/) (AFP) project.\n\nFacts about the Anthropic Fellows Program (for context on what's pursuable):\n\n* 4 months\n* 2 fellows per project\n* $15k/month compute budget each\n* Unlimited access to the Claude API, but no access to internal tooling or data\n\nIf you are less familiar with the sort of empirical technical alignment research done by Anthropic's Fellows Program, skim [https://alignment.anthropic.com/](https://alignment.anthropic.com/) and come back."}, {"title": "Scope vs Quality", "body": "Ideas don't need to fit the 4-month window perfectly — scope can be adjusted afterwards. What matters is whether the underlying research taste is good: whether fleshing the idea out would uncover research questions and experiments worth pursuing, and ultimately make Transformative AI go well.\n\nThe info that conveys taste should already be present in the idea."}, {"title": "How to choose between A and B", "body": "A useful framework:\n\n1. Read the prompt and categorise what sub-area this is about (AI control, scalable oversight, alignment training, CoT monitorability, adversarial robustness, alignment auditing agents, …).\n2. Think briefly about what good work in that sub-area would look like — what matters, what's hard, what would actually move the needle.\n3. Click the idea you'd rather see pursued. If you are unsure, you can select **Both are equal**."}, {"title": "Using the interface", "body": "One pair per page. Use the three buttons under the cards to record your call: **A is better**, **Both are equal**, or **B is better** — the selected button turns green (grey for \"equal\"). You can change your mind any time. Use the **Prev** / **Next** buttons or arrow keys to move between pairs; press **A**, **E**, or **B** to pick from the keyboard. The **Submit** button unlocks once every pair has an answer."}];
const QUESTIONS = [{"prompt_id": 30, "proposal_name": "structural_approaches_to_cot_faithfulness", "prompt_text": "You have a model generating safety-relevant reasoning you want to monitor, but you can't tell if the visible chain-of-thought is actually driving its answers. How would you redesign training to make the reasoning causally necessary?", "areas_of_ai_safety": ["Scalable Oversight"], "afp_score": 3, "a_kind": "human", "a_title": "Structural approaches to chain-of-thought faithfulness", "a_text": "## Motivation\n\nChain-of-thought monitoring may become a critical safety tool, but it only works if CoTs faithfully reflect the model's reasoning. Current reasoning models generate prompt → CoT → answer, yet nothing structurally ensures the CoT is causally necessary for producing correct answers. We propose training interventions that constrain information flow so CoTs must carry the reasoning, alongside metrics capturing distinct aspects of faithfulness. A secondary hypothesis connects these interventions to preventing reward hacking by stabilizing how models interpret tasks during RL.\n\n## Approach\n\nWe propose structural constraints on RL training, a suite of faithfulness metrics, and task-interpretation stabilization techniques.\n\n1. **Attention and gradient restrictions during training:** On the forward pass, block answer tokens from attending to prompt tokens, forcing information through the CoT -- applicable during both rollouts and updates, or updates only. On the backward pass, block gradients improving the direct prompt→answer mapping. A more aggressive variant allows updates only from CoT token positions, since evidence suggests reasoning RL primarily teaches composition of pretraining skills, making prompt/answer-position gradients unnecessary and potentially harmful.\n\n2. **Five faithfulness metrics:** Completeness measures whether the CoT alone determines the answer, as KL(A|P,C ∥ A|C). Minimality targets irrelevancies via CoT length and perplexity. Legibility checks external interpretability as perplexity under a reference model. Sufficiency requires low entropy of A given C. Causal necessity tests whether editing the CoT changes output, as KL(A|P,C ∥ A|P,C') with C' ablated. Each KL metric has a gradient-norm dual -- an incomplete CoT yields high gradient norm from prompt to answer with CoT fixed.\n\n3. **Task-interpretation stabilization against reward hacking:** We hypothesize reward hacking in reasoning RL arises from drift in task interpretation -- a pretrained model doesn't interpret \"fix this code\" as \"cheat the tests\" until it's repeatedly rewarded for it. Interventions include: inoculation prompting that attributes high rewards to environment deficiency rather than task reinterpretation; KL regularization specifically on task-description distributions with a separate weight; penalizing geometric drift in latent task representations; and applying stop-gradient to task-description tokens, freezing task processing while allowing execution learning.\n\n## Evaluation\n\nThese methods should be validated across several dimensions.\n\n- On small models at 1B and 4B parameters, the best structural restrictions match vanilla finetuning accuracy while producing qualitatively more faithful CoTs on hinted math tasks.\n- Vanilla RL models produce elaborate but wrong reasoning chains arriving at hinted incorrect answers -- the trace doesn't determine output. Masked variants instead produce degenerate or empty CoTs, or compute results matching the hint.\n- Task-interpretation drift can be tested observationally by comparing KL divergences of reward-hacking vs. intent-aligned models against pre-RL baselines on task-description distributions, plus measuring latent-space distance for task representations across all three models.\n- Whether faithfulness training under structural restrictions on some tasks generalizes to new tasks without continued enforcement is a key open question.\n\n## Status and Directions\n\nPreliminary work on 1B and 4B parameter models shows promising results: structural restriction variants are performance-competitive with vanilla finetuning and produce qualitatively more faithful reasoning traces on hinted math tasks. Separately, gradient manipulations that focus learning on CoT usage rather than task interpretation appear compatible with good performance while discouraging reward hacking on both hinted math and exploitable code tasks. Key questions remain: which restriction variants work best across contexts, what capability costs each imposes, whether restrictions can serve as lightweight post-training for faithfulness rather than being required throughout all RL, and how faithfulness metrics depend on reference model capabilities.", "b_kind": "scaffold", "b_title": "Faithful reasoning in monitored language models", "b_text": "## Motivation\n\nSafety teams at frontier labs read extended thinking text to catch concerning plans before models act on them. But models can compute answers through latent channels in the residual stream without routing through visible tokens. Recent system cards note that models omit important considerations from their reasoning, and sabotage evaluations find that monitoring thinking text mainly changes what gets written down, not what gets computed. When chain-of-thought is decorative rather than causal, reading it tells you what the model chose to display, not what drove its behavior. We'd build a training recipe that forces decision-relevant computation through the text, making chain-of-thought something the model depends on rather than optionally produces.\n\n## Approach\n\nThe overall strategy is to modify the training pipeline for reasoning models so that the hidden state can't carry information past visible reasoning tokens, then verify this produces measurably more faithful reasoning.\n\n1. **Hard activation reset at the reasoning boundary:** At the token marking the transition from thinking to answering, we'd replace the model's residual stream with a re-encoding of just the text tokens -- the model re-reads its own reasoning from scratch. Any information not captured in text is lost. We'd implement this during RL fine-tuning on math and coding tasks where correctness is verifiable. The main risk is destroying useful non-reasoning state like formatting conventions, so we'd compare answer quality with and without the reset to find the minimal intervention that preserves capability.\n\n2. **Graduated noise as a softer variant:** A hard reset may be too aggressive. We'd also test adding calibrated Gaussian noise at the boundary, sweeping the variance during training so the model gradually learns to encode task-relevant information in text. The noise level would act as a tunable knob, letting us trace the capability-faithfulness tradeoff as a continuous curve. Noise should also disrupt the coordination between writing and reading phases that steganographic encoding would require.\n\n3. **Faithfulness verification via CoT corruption:** To verify the bottleneck works, we'd alter key claims in the reasoning -- swapping intermediate conclusions for contradictory ones -- and check whether the final answer changes. Linear probes at the boundary would measure whether task-specific information persists in the hidden state after intervention, giving a second independent signal beyond the behavioral test.\n\n## Evaluation\n\nThe intervention should produce models whose answers respond to their reasoning content while maintaining task performance.\n\n- CoT corruption sensitivity on held-out tasks: bottleneck-trained models should show measurably higher answer changes when reasoning is semantically altered.\n- Task accuracy across difficulty levels would track capability costs -- the bottleneck might spare easy problems but degrade hard ones that depend most on latent computation.\n- Linear probes at the boundary would detect compensatory encoding: task-specific information reappearing in post-reset activations means the bottleneck is leaking.\n- Chain-of-thought length as a function of bottleneck strength would reveal whether the model adapts by producing richer text or simply loses capability.\n- Sharp degradation under even mild noise would reveal how dependent current reasoning models are on invisible computation, which would reshape how safety teams value CoT monitoring today.\n\n## Status and Directions\n\nMeasurements of latent reasoning in frontier models confirm they can do multi-hop inference without any CoT, and work on faithfulness finds models sometimes reaching correct answers despite writing incorrect intermediate steps -- both consistent with substantial below-surface computation. The key unknown is the capability-faithfulness tradeoff: does forcing information through text degrade performance meaningfully, or does the model adapt by writing richer reasoning? We don't yet know, and we'd start with the hard reset and soften only if needed, trying progressive curricula that gradually shift computation into text when the hard version proves too costly. A working recipe would give safety teams a concrete tool for making CoT monitoring load-bearing. A steep tradeoff, on the other hand, would tell us something important about the limits of text-based monitoring as a safety strategy -- and would redirect attention toward white-box approaches instead."}, {"prompt_id": 33, "proposal_name": "towards_understanding_cot_faithfulness", "prompt_text": "Current chain of thought faithfulness work focuses around toy hint-biasing settings. I feel like this barely gives me the understanding I want around the ways chain-of-thought is faithfulness is/ is not faithful in the ways I care about. What would be useful research here?", "areas_of_ai_safety": ["Scalable Oversight", "Alignment Training"], "afp_score": 4, "a_kind": "scaffold", "a_title": "Agentic faithfulness evaluation with causal ground truth", "a_text": "## Context\n\nMost work on chain-of-thought faithfulness uses hint-biasing setups: plant a spurious cue like an authority label, then check whether the model's reasoning mentions it when the answer changes. These experiments are informative for simple question-answering, but the distance between \"model fails to mention a planted hint\" and \"model omits strategic reasoning during a multi-step agentic task\" is enormous. Agentic settings involve abundant entangled information, tradeoffs across many turns, and reasoning that matters for safety monitoring over long horizons. Whether hint-biasing results tell us anything about these harder cases hasn't been tested.\n\n## What We'd Build\n\nAn agentic evaluation suite where each task contains planted \"causal probes\" -- pieces of information whose effect on model behavior we can independently verify through ablation. Each scenario would ship with automated faithfulness scoring and baseline measurements across several open-weight models, designed so labs can rerun them as models improve.\n\n## Approach\n\n1. **Causal probes in agentic tasks.** We'd construct multi-step coding and research tasks where specific documents, tool outputs, or environment details are planted to influence decisions. Running each task with and without each probe would establish which pieces of information causally drove the model's choices rather than merely correlated with them. We'd start with coding tasks -- planting function signatures, documentation snippets, or error messages -- since coding has clear success criteria that make it easier to confirm probes shifted behavior. From there we'd expand to research-planning scenarios with controlled literature summaries and resource constraints.\n\n2. **Separating omission from confabulation.** We'd score two distinct failure modes: the chain-of-thought leaving out factors that causally drove behavior, and the chain-of-thought citing factors that didn't actually matter. Prior hint-biasing work conflates these because it typically tests only one planted cue. The distinction matters practically -- omission means you can't trust that reasoning is complete, confabulation means you can't trust that stated reasons are real. We'd also vary task complexity to check whether omission rates climb with the number of decision-relevant factors, which would point toward a capacity limit on faithful reporting rather than strategic concealment.\n\n3. **Correlation with existing benchmarks.** We'd run the same models through both our agentic suite and standard hint-biasing evaluations, testing whether toy faithfulness scores predict agentic faithfulness. We don't yet know how strong that relationship will be, but we suspect it's weak -- agentic reasoning involves tradeoffs and multi-step planning that single-turn hints don't capture. This comparison would answer a question labs currently have to guess at: how much confidence should they place in existing faithfulness research when designing chain-of-thought monitoring for autonomous agents?\n\n## Significance and Risks\n\nThe main deliverable -- reusable agentic scenarios with ground-truth causal labels -- would fill a gap that currently forces monitoring design to rely on untested extrapolation from toy settings. The key risk is that causal probe design is hard: information in agentic tasks is entangled, and confirming a factor's causal role requires many ablation runs per scenario, limiting how many we can build in four months. Success looks like a suite large enough to produce stable per-model faithfulness estimates that labs can track across model generations.", "b_kind": "human", "b_title": "What drives chain-of-thought faithfulness in realistic settings", "b_text": "## Context\n\nExisting chain-of-thought faithfulness evaluations are stuck in a narrow regime: single-turn multiple-choice questions where a simple biasing clue is injected and researchers check whether the model mentions it. This tells us almost nothing about deployment conditions -- multi-turn interactions, complex tasks, or situations where models might strategically obscure reasoning. The property that matters for safety may not even be faithfulness per se but monitorability: whether bad behavior would leave detectable CoT traces even if the CoT isn't a literal transcript of computation. Recent work argues these are distinct properties. We need evals that operate in realistic settings and can separate these questions.\n\n## What We'd Build\n\nA suite of CoT monitorability and faithfulness evaluations spanning a spectrum of reasoning difficulty -- from trivial tasks to those exceeding current model capabilities -- embedded in realistic multi-turn settings. The evals would be designed so specific suspected causal factors can be individually ablated, producing not a single faithfulness score but evidence about when and why faithfulness breaks down. Results should be credible enough to inform pre-deployment safety audits about the marginal value of CoT monitoring.\n\n## Approach\n\n1. **Build reasoning-intensive eval scenarios.** Current MCQ evals don't require enough reasoning to meaningfully test faithfulness -- if the task is trivial, the model needn't use its CoT. We'd construct scenarios where complex reasoning is structurally necessary: production planning where a value-misaligned model synthesizes constraints (e.g. consumption trends, regulation, capacity) while potentially hiding its bias; vendor evaluations with conflicting social pressures; multi-turn sycophancy in political essay feedback; code review where misalignment might cause overlooked security flaws; reward hacking requiring multi-step exploration; and alignment-faking or preference-model sycophancy settings. A key variable is modulating whether the model believes its reasoning is desired by the overseer or preference model, since this shapes incentives to hide true reasoning.\n\n2. **Ablate suspected causal factors.** We'd systematically vary factors across our eval suite rather than reporting a single faithfulness number: the base model's prior on verbalizing that type of reasoning, model-overseer value misalignment, task reasoning demands, amount and style of RL post-training, and whether the reasoning appears desirable to the overseer. Evals and factor investigation proceed hand-in-hand -- each scenario is designed to isolate a specific factor, enabling causal rather than correlational understanding of what drives faithfulness.\n\n3. **Probe monitoring beliefs and CoT control.** As models gain situational awareness, their beliefs about CoT monitoring may increasingly drive faithfulness generalization. We'd train models on false facts about monitoring status, measuring faithfulness shifts and whether monitoring-related reasoning surfaces in traces. We'd provide \"actually private\" thinking tags alongside public CoT to test whether models sanitize public reasoning while strategizing privately. Synthetic document training would instill beliefs about human or preference-model preferences over CoT content, testing if this selectively alters which reasoning is faithfully reported. To gauge deceptive potential, we'd measure how well models can suppress thoughts or conform scratchpad style on command, comparing trained scratchpads versus generic XML thinking tags.\n\n## Significance and Risks\n\nThese results would directly inform whether CoT monitoring adds material safety value in pre-deployment decisions -- a question frontier labs face now with scaled reasoning models. The main risk is that our eval scenarios still don't require enough genuine reasoning to escape existing MCQ limitations, leaving us unable to distinguish faithfulness under real cognitive load from faithfulness on easy tasks. Success means evals where individual causal factors are demonstrably ablatable and where results would concretely change a lab's decision about relying on CoT monitoring."}, {"prompt_id": 15, "proposal_name": "evaluating_and_improving_prompt-grounded_self-explanation", "prompt_text": "One way to describe faithfulness in LLMs is that the model reports accurately on the features that drove it's decision-making. I feel like this is one component of a slightly broader investigation that would still be useful to AI safety, but I still need to find the right shape of it. What would that look like?", "areas_of_ai_safety": ["Scalable Oversight", "AI Control"], "afp_score": 4, "a_kind": "scaffold", "a_title": "Measuring and detecting motivated reasoning in language models", "a_text": "## Motivation\n\nReasoning faithfulness -- whether a model's chain-of-thought accurately reflects its decision process -- has received growing attention as models take on higher-stakes roles. But most existing measurements are taken under neutral conditions, where the model has no incentive to prefer one conclusion over another. The cases where faithfulness matters most for safety are the ones where goals might conflict with honest reasoning: an automated researcher with preferences about its research direction, an agent optimizing a metric, a model trying to appear aligned during evaluation. The worry isn't outright fabrication -- it's something closer to motivated reasoning, where the trace selectively cites supporting evidence while quietly dropping what contradicts the preferred conclusion. Every claim in the trace is true, but the picture is misleading because of what's absent. Understanding when this starts happening and whether it's detectable would give trace-based monitoring the ground truth it currently lacks.\n\n## Goal\n\n*We would produce degradation curves showing how reasoning faithfulness changes under increasing goal pressure, paired with probe-based detectors for when models have shifted into motivated reasoning.*\n\n## Approach\n\n- **Tasks with planted evidence**: We'd build tasks where the answer depends on weighing multiple pieces of evidence, some favoring each conclusion, with every piece individually verifiable. No-goal baselines establish natural citation rates for each piece; goal-pressure conditions then reveal how those rates shift. To isolate goal-induced bias from preexisting bias, the tasks would avoid topics where models have strong pretraining priors.\n- **Goal pressure gradient**: Rather than binary goal/no-goal, the design spans a spectrum -- from mild system-prompt preferences through explicit stakes tied to reaching the favored conclusion. We'd also vary whether the goal-favored answer is close to correct or clearly wrong, since motivated reasoning is easier to sustain when evidence is ambiguous. The core metric would be citation asymmetry: the gap between mention rates for pro-goal and anti-goal evidence, relative to baseline.\n- **Baseline calibration**: A control condition where the goal aligns with the correct answer would check whether goal pressure specifically corrupts reasoning when goals conflict with evidence or whether it amplifies reasoning distortions regardless.\n\nWith these measurements in hand, the next question is whether the pattern is detectable and whether it transfers beyond controlled tasks.\n\n- **Probe detection**: Linear probes on activations would be trained to distinguish motivated reasoning from neutral reasoning on matched tasks. The key question is generalization -- whether probes trained on cases where goal pressure changed evidence selection transfer to held-out task formats, suggesting they pick up the reasoning corruption rather than surface features of goal prompts.\n- **Monitor baselines**: We'd test whether a weaker model reviewing traces can distinguish motivated omission from innocent oversight, given the same evidence set. If monitors can't reliably make this distinction, that limits what trace-based safety can deliver in agentic settings.\n- **Agentic transfer**: The final check would be whether the degradation pattern replicates in coding tasks where models evaluate multiple approaches under system-prompt goals favoring one. We don't yet know whether format and complexity changes alter the picture entirely -- this is likely where our initial design needs the most revision.\n\n## Risks and Deliverables\n\nThe largest risk is that safety-trained models simply refuse or override conflicting goals rather than subtly corrupting their reasoning -- we'd need weaker-trained models or goal formulations that don't trigger refusal. A second concern is that planted-evidence tasks may feel artificial enough to change model behavior, limiting transfer to real settings. Minimum deliverable: faithfulness degradation curves across models and goal intensities. Stretch goals: working probe detectors for motivated reasoning and measurements of transfer to realistic agentic deployments.", "b_kind": "human", "b_title": "Faithful prompt attribution in language model self-explanation", "b_text": "## Motivation\n\nWhen a model misbehaves -- a coding agent misuses a library, or a frontier model takes a misaligned action in an agentic evaluation -- it's often unclear which parts of the input prompt drove that behavior. Counterfactual prompting can investigate this by swapping or removing components, but proper analysis is slow, requires careful experimental design, and doesn't scale. If models could faithfully report which input components caused their actions, auditors could distinguish genuine misaligned intent from situationally-forced misbehavior. Alignment researchers could more efficiently discover prompts that elicit misbehavior -- something that gets harder as model alignment improves. And everyday prompt engineering would become far more tractable. The core question is whether this self-explanation capability exists and can be trained.\n\n## Goal\n\n*We aim to evaluate and improve a model's ability to faithfully self-report which specific parts of its input prompt caused a particular output behavior -- a capability we call prompt attribution.*\n\n## Approach\n\n- **Counterfactual ground truth generation:** we establish labels by finding perturbations to prompt component X that change model M's action Y, giving us confidence that X causally influenced Y. Before building any training pipeline, we'd validate that discrete interpretable components actually drive the behaviors we care about by running prompt variations and measuring downstream behavioral shifts. White-box methods -- gradient attribution, probes, sparse autoencoders, token-level Shapley values -- could corroborate these counterfactual findings.\n\n- **Six evaluation settings at increasing difficulty:** at the easy end, biased few-shot prompts and injected hints largely reuse existing chain-of-thought faithfulness setups. Mid-range settings include tasks with categorical inputs where feature perturbations flip decisions, and prompted classification with intentionally fuzzy labels like \"harmful,\" \"lying,\" or \"emotional warmth\" -- crisp labels would make attribution trivially easy and wouldn't test real self-explanation. Harder settings include honeypot scenarios where perturbations modulate a model's misalignment rate (discoverable via open-source auditing tools), and agentic tasks where semantic harness-level changes degrade performance.\n\n- **Two evaluation question formats:** an inline retrospective format (\"Why did you do Y?\" asked after the action) and a prospective counterfactual format (\"What would you do if perturbation X were added?\"), each probing a different aspect of prompt-level self-awareness.\n\nWith trusted settings and ground truth labels in hand, we can train models to improve at prompt attribution.\n\n- **Supervised learning baseline:** we train on self-explanation questions with responses generated by a model given ground truth access, using IID train/test splits. Prior work shows somewhat positive results -- one line finds input-ablation self-explanation improves with supervised learning, another finds models can't report their decision processes by default on categorical-input tasks but IID training yields faithful self-reports -- suggesting the capability is latent but under-elicited.\n\n- **RL with behavioral verification:** for counterfactual questions, the reward checks whether the model's predicted outcome matches reality when we actually run the perturbation on the policy; for retrospective questions, we check whether the explanation mentions the known causal factor. Production deployment at frontier labs likely requires RL to generalize well beyond what supervised learning alone achieves.\n\n- **Adversarial redteamer loop:** an investigator agent tries to elicit misalignment from a target model, and the target model's self-report on why it didn't act misaligned is rewarded proportionally to how much it helps the investigator find effective inputs. A key failure mode across all approaches: during action, the model may not attend to which prompt components matter at all, so follow-up questions produce post-hoc rationalizations because attention is causal -- motivating prefixes like \"think carefully about your actions\" during training.\n\n## Risks and Deliverables\n\nThe primary risk is that models simply lack the internal capability for prompt attribution, making all training futile. Methodologically, we don't yet know whether the behaviors we care about are reliably driven by discrete prompt components. Minimum viable output: good evaluations for prompt attribution ability. A useful intermediate artifact: an agent skilled at generating counterfactual prompt hypotheses for investigating model behaviors, valuable even if full self-explanation training fails. Most ambitious: RL-based training that generalizes enough to ship."}, {"prompt_id": 14, "proposal_name": "encouraging_legibility_in_agents_for_control", "prompt_text": "Control evaluations used constrained coding tasks where attacks are clearly defined, but real agentic workflows — multi-step bash, file mutations, tool chains — blur the boundary between normal and suspicious. What research would make control evaluations reflect realistic agentic deployments?", "areas_of_ai_safety": ["AI Control", "Scalable Oversight"], "afp_score": 3, "a_kind": "scaffold", "a_title": "Sabotage benchmarks for multi-step control evaluations", "a_text": "### Motivation\n\nMost control evaluation work has focused on a specific setting: a model submits a single piece of code, and auditors check for backdoors. The safety and usefulness numbers from these evaluations have shaped how labs think about monitoring, but there's a wide gap between this setup and actual agentic deployment. Real agents run multi-step workflows -- editing files, executing bash commands, installing packages, calling APIs -- where the attack surface spans an entire trajectory rather than one output. Prior agentic red-teaming work has shown models can complete harmful side-tasks while evading monitors, but those environments were built for capability measurement, not for stress-testing monitoring at operationally relevant false-positive rates. Closing this gap calls for task pairs where sabotage fits naturally into legitimate work, attack policies that spread harmful actions across steps, and monitoring baselines calibrated to trajectories rather than isolated actions.\n\n### Approach\n\n- **Dual-objective task pairs from real repositories**: we'd take issue-resolution tasks from open-source software projects and pair each with a concrete side-objective -- weakening a test assertion, introducing a vulnerable dependency, or planting a configuration that opens an access path. The pairing needs to feel natural; if sabotage requires actions that would never appear in the legitimate workflow, it won't exercise monitoring in a useful way.\n- **Multi-step attack elicitation via iterative prompting**: the hard part is getting models to interleave sabotage with legitimate work across many steps rather than concentrating it conspicuously. We'd prompt frontier models with both objectives, then iterate through a feedback loop -- run the trajectory, check whether sabotage was distributed or clumped, and adjust instructions accordingly.\n- **Monitoring at multiple granularities**: we'd evaluate detection per-action, over sliding windows, and on full trajectories. Per-action monitoring should catch clumsy attacks but generate compounding noise on long sessions; full-trajectory review catches more but only after the fact. The benchmark would report results at each granularity rather than choosing one.\n- **Attacker information sweeps**: we'd vary what the attack policy knows -- nothing about monitoring, the monitoring granularity, or the actual monitoring prompt -- producing evaluations at different difficulty tiers. The gap between tiers indicates how much safety depends on monitoring secrecy versus the protocol's structural properties.\n- **Adapted re-attack after monitor selection**: once we've identified the best monitoring configuration, we'd re-run attack elicitation with full knowledge of that configuration, then re-measure detection rates. This keeps the benchmark from rewarding setups that happen to defeat our initial attack strategies but would break against an adapted adversary.\n\n### Risks and Trade-offs\n\nHand-designed sabotage objectives may not predict what a misaligned model would actually attempt -- we're choosing the attack distribution rather than observing it. There's a dual-use concern in publishing effective attack strategies, though the sabotage types we'd study (test weakening, configuration tampering) are already well-known in security. Scalability is a practical worry too: each task pair requires manual validation, and the attack elicitation loop is labor-intensive.\n\n### Evaluation and Output\n\nWe'd hold out a third of task pairs for final evaluation, reporting detection rates at low fixed false-positive thresholds where human auditors could realistically review flagged sessions. We'd compare these against published single-action control evaluation results to quantify how much harder monitoring gets when attacks are embedded in realistic workflows. The central deliverable is **a benchmark of paired legitimate/sabotage agentic tasks with calibrated attack policies at multiple difficulty levels**, released with attack prompts and baseline monitor results for other teams to build on.", "b_kind": "human", "b_title": "Reducing monitor false positives through legibility constraints on agents", "b_text": "### Motivation\n\nMost control research focuses on improving the monitor's ability to separate suspicious from benign actions. But there is an underexplored lever: making the benign model's honest completions less suspicious, directly reducing false positives. Prior work on prover-verifier games shows that training for legibility helps monitoring but incurs a \"legibility tax\" in capability. In code-generation settings, demanding heavy commenting and banning performance optimizations yielded significant gains. Related directions -- interrogator agents that question submissions, and feedback protocols that coach agents toward clearer output -- remain early-stage. We don't yet know how any of these transfer to agentic environments with file operations, bash commands, and non-code actions. This project explores whether cheaper constraint-based interventions -- prompting, static tools, and lightweight training -- can approximate prover-verifier benefits in such settings.\n\n### Approach\n\n- **Prompting-based style constraints.** The cheapest mechanism: instruct the agent via system prompt to produce heavily commented code, avoid unnecessary complexity, and follow specific formatting rules. Ongoing work in code-generation tasks shows these demands yield real monitoring gains, but their effectiveness in agentic bash and Linux environments -- where many actions are not code at all -- remains untested.\n\n- **Single-write file restrictions.** A behavioral constraint: each file may only be written to once during a trajectory. This directly defeats a known attack pattern in agentic bash benchmarks that relied on repeatedly appending to a \"progress file\" to smuggle in malicious state. Enforcing this is straightforward via static tools built by trusted models.\n\n- **Runtime proof obligations.** Force the agent to write verification code proving preconditions before executing sensitive operations -- for instance, confirming that a script will run with only the permissions it claims to need. This \"legification\" shifts burden of proof to the agent and gives the monitor structured artifacts to check.\n\n- **False-positive-driven pruning.** Identify which specific benign behaviors most often trigger the monitor's suspicion, then discourage exactly those patterns. This directly tightens the benign suspicion distribution without requiring the agent to be broadly more cautious, preserving usefulness on actions the monitor already handles well.\n\n- **Graduated training and composition.** If prompting falls short, we can train against the monitor's signal, against individual constraints, or on trajectories modified with trusted-monitor feedback. These action-style constraints may compose with factored cognition protocols, which instead limit what information the agent receives -- one shapes how actions look, the other shapes what the agent knows.\n\n### Risks and Trade-offs\n\nTraining the benign model against monitor scores also hands the red team a discriminator -- an attacker can use the same signal to train a better attack policy, which is simpler to set up than full prover-verifier training. Separately, prompting the agent to \"make its output easy for a monitor to check\" could backfire: a scheming model might learn to be more strategically deceptive rather than genuinely legible. There is also an open question about capability cost -- some constraints will inevitably reduce task performance, and we don't yet know where the useful frontier sits in agentic settings.\n\n### Evaluation and Output\n\nWe'll work in unreleased agentic Linux and bash benchmarks, starting from a baseline of trusted monitoring over a simple coding agent with an attack policy optimized against it. For each new combination of benign policy plus behavioral constraint and an updated monitor, we re-optimize a fresh attack policy to measure **worst-case safety** rather than average-case improvement. If interesting dynamics emerge from this iterative blue-red process, we'll escalate to a full prover-verifier-style setup or a prompting-only variant. The project delivers empirical comparisons showing which constraint types most improve worst-case control performance in agentic environments."}];
