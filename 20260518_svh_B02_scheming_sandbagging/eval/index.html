<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pairwise Idea Preference — Scheming, sandbagging, hidden misalignment</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root {
    --primary: #C15F3C;
    --primary-hover: #9C4A2D;
    --bg: #F4F3EE;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --text-secondary: #666666;
    --muted: #999999;
    --border: #E0DDD4;
    --row-hover: #FAFAF7;
    --accent-soft: #FDF2EC;
    --gold: #C99C2C;
    --gold-dark: #92400E;
    --gold-bg: #FEF3C7;
    --gold-soft: #FEF7E0;
    --success: #2D8F6F;
    --success-hover: #226E55;
    --success-bg: #D1FAE5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 14px;
}
.app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 1600px; margin: 0 auto;
    padding: 10px 16px 10px 16px;
    gap: 10px;
}
.hidden { display: none !important; }

/* Compact topbar */
.topbar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
}
.topbar-title { font-size: 1rem; font-weight: 700; line-height: 1.2; }
.topbar-sub { font-size: 0.78rem; opacity: 0.92; margin-top: 1px; font-variant-numeric: tabular-nums; }
.topbar-progress {
    width: 240px; height: 6px; background: rgba(255,255,255,0.25);
    border-radius: 10px; overflow: hidden;
}
.topbar-progress-fill { background: white; height: 100%; border-radius: 10px; transition: width 0.3s ease; }
.topbar-help {
    background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    transition: all 0.12s;
}
.topbar-help:hover { background: rgba(255,255,255,0.28); border-color: rgba(255,255,255,0.5); }

/* Registration screen — collected before onboarding */
.registration-screen {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 32px;
}
.registration-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 30px 36px; max-width: 480px; width: 100%;
}
.registration-card h2 { color: var(--primary); font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; }
.registration-card .intro { color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 20px; line-height: 1.55; }
.reg-field { margin-bottom: 14px; }
.reg-field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 5px; }
.reg-field input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 0.95rem;
}
.reg-field input:focus { outline: none; border-color: var(--primary); }
.reg-error { color: var(--primary); font-size: 0.82rem; margin-top: 4px; min-height: 1em; }
.reg-foot { font-size: 0.78rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.reg-submit-wrap { margin-top: 20px; text-align: center; }
.reg-submit-btn {
    background: var(--primary); color: white; border: 1px solid var(--primary);
    padding: 11px 28px; border-radius: 8px;
    font-size: 0.98rem; font-weight: 700; cursor: pointer; transition: all 0.12s;
}
.reg-submit-btn:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.reg-submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Onboarding screen (scrolls) */
.onboarding-screen {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; justify-content: center;
}
.onboarding-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 820px; width: 100%;
    margin: 4px auto 20px auto;
    height: max-content;
}
.onboarding-card h2 {
    color: var(--primary); font-size: 1.3rem; font-weight: 700;
    margin-bottom: 18px;
}
.onboarding-section { border-top: 1px solid var(--border); padding: 14px 0; }
.onboarding-section:first-of-type { border-top: none; padding-top: 4px; }
.onboarding-section .sec-title {
    font-weight: 700; color: var(--text);
    font-size: 1rem; margin-bottom: 4px;
}
.onboarding-section .sec-body { color: var(--text); font-size: 0.94rem; line-height: 1.7; }
.onboarding-section .sec-body p { margin: 6px 0; }
.onboarding-section .sec-body ul, .onboarding-section .sec-body ol { margin: 6px 0 6px 22px; }
.onboarding-section .sec-body li { margin: 3px 0; }
.onboarding-section .sec-body code { background: var(--accent-soft); color: var(--primary); padding: 1px 5px; border-radius: 3px; font-size: 0.88em; }
.onboarding-section .sec-body a { color: var(--primary); }

/* Eval screen: flex column filling remaining viewport. */
.eval-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

/* Idea grid: fills remaining vertical space; each card scrolls internally. */
.idea-grid {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.idea-card {
    background: var(--row-hover);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
.idea-card .card-head {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px 8px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.5);
}
.idea-card .idea-title { font-size: 0.98rem; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
.idea-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 10px 16px 14px 16px;
    font-size: 0.88rem; line-height: 1.6; color: var(--text);
}
.idea-body p { margin: 5px 0; }
.idea-body ul, .idea-body ol { margin: 5px 0 5px 20px; }
.idea-body li { margin: 2px 0; }
.idea-body strong { color: var(--text); }
.idea-body h1, .idea-body h2, .idea-body h3, .idea-body h4 {
    font-size: 0.95rem; font-weight: 700; color: var(--primary); margin: 10px 0 4px 0;
}
.idea-body h1:first-child, .idea-body h2:first-child, .idea-body h3:first-child, .idea-body h4:first-child { margin-top: 0; }

.idea-badge {
    display: inline-block;
    font-weight: 800; font-size: 0.74rem; letter-spacing: 1px;
    padding: 2px 9px; border-radius: 4px;
    background: var(--success); color: white;
}

/* Preference button row: A is better / Both equal / B is better */
.pref-row {
    flex: none;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px;
}
.pref-btn {
    background: var(--surface); color: var(--text);
    border: 1.5px solid var(--border);
    padding: 10px 14px; border-radius: 8px;
    font-size: 0.92rem; font-weight: 700;
    cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.pref-btn:hover { border-color: var(--success); color: var(--success); }
.pref-btn.selected {
    background: var(--success); border-color: var(--success); color: white;
    box-shadow: 0 2px 8px rgba(45, 143, 111, 0.25);
}
.pref-btn.selected:hover { background: var(--success-hover); border-color: var(--success-hover); color: white; }

/* Tie button uses a neutral grey instead of green to avoid implying preference. */
.pref-btn[data-choice="tie"]:hover { border-color: #6B7280; color: #6B7280; }
.pref-btn[data-choice="tie"].selected {
    background: #6B7280; border-color: #6B7280; color: white;
    box-shadow: 0 2px 8px rgba(107, 114, 128, 0.25);
}
.pref-btn[data-choice="tie"].selected:hover { background: #4B5563; border-color: #4B5563; color: white; }
.pref-btn .kbd-mini {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.72rem; font-weight: 600;
    background: var(--bg); color: var(--text-secondary);
    padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border);
}
.pref-btn.selected .kbd-mini { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.35); color: white; }

/* Inline notes textarea, single row in the bottom band */
.notes-row {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px;
}
.notes-row label { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.3px; text-transform: uppercase; flex: none; }
.notes-row textarea {
    flex: 1; min-height: 28px; max-height: 70px; resize: vertical;
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 0.85rem; line-height: 1.4;
}
.notes-row textarea:focus { outline: none; border-color: var(--primary); }

/* Bottom nav: prev / pager dots / submit / next */
.nav-bar {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px;
}
.pager-dots { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pager-dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 0.74rem; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; transition: all 0.12s;
}
.pager-dot:hover { border-color: var(--primary); color: var(--primary); }
.pager-dot.current { background: var(--primary); border-color: var(--primary); color: white; }
.pager-dot.answered { color: var(--success); border-color: var(--success); background: var(--success-bg); }
.pager-dot.current.answered { background: var(--success); border-color: var(--success); color: white; }
.nav-side { display: flex; align-items: center; gap: 6px; }

.btn {
    padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: all 0.12s;
}
.btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
.btn.btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); color: white; }
.btn.btn-primary:disabled { background: var(--primary); border-color: var(--primary); color: white; opacity: 0.4; }

.kbd { display: inline-block; padding: 1px 6px; background: var(--bg); border: 1px solid var(--border);
       border-radius: 3px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.74rem; }

/* Summary screen — review picks before submitting */
.summary-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.summary-header {
    flex: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px;
}
.summary-header h2 { color: var(--primary); font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
.summary-header .sub { color: var(--text-secondary); font-size: 0.88rem; }
.summary-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
.summary-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
    display: grid; grid-template-columns: 60px 1fr 160px; gap: 12px; align-items: center;
    cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s;
}
.summary-row:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(193, 95, 60, 0.06); }
.summary-row.unanswered { border-color: #E0B4A8; background: #FBEEE8; }
.summary-row .pair-no { font-size: 0.78rem; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; }
.summary-titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.summary-title {
    display: flex; gap: 8px; align-items: baseline; min-width: 0;
    font-size: 0.88rem; color: var(--text-secondary);
}
.summary-title .idea-badge { flex: none; }
.summary-title .ttext {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.summary-title.winner { color: var(--text); font-weight: 600; }
.summary-title.winner .ttext { color: var(--text); }
.summary-pick {
    text-align: center; font-size: 0.85rem; font-weight: 700;
    padding: 6px 10px; border-radius: 6px;
    background: var(--success); color: white;
    white-space: nowrap;
}
.summary-pick.tie { background: #6B7280; }
.summary-pick.none { background: #F4F3EE; color: #B25C46; border: 1px dashed #D49A8B; font-weight: 600; }

/* Onboarding screen start button */
.onboarding-start-wrap { margin-top: 24px; text-align: center; }
.onboarding-start-btn {
    background: var(--primary); color: white;
    border: 1px solid var(--primary);
    padding: 12px 32px; border-radius: 8px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: all 0.12s;
}
.onboarding-start-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

/* Help overlay (reused from v5 style) */
.help-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
}
.help-modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 32px 36px;
    max-width: 780px; width: 100%;
    max-height: 88vh; overflow-y: auto;
    position: relative;
    font-size: 0.95rem; line-height: 1.7;
}
.help-modal h2 { color: var(--primary); font-size: 1.3rem; margin-bottom: 16px; }
.help-modal .help-section { border-top: 1px solid var(--border); padding: 14px 0; }
.help-modal .help-section:first-of-type { border-top: none; padding-top: 4px; }
.help-modal .help-section .h-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
.help-modal .help-section a { color: var(--primary); }
.help-modal .help-section code { background: var(--accent-soft); color: var(--primary); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }
.help-modal img { max-width: 100%; height: auto; }
.help-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none;
    font-size: 1.6rem; cursor: pointer;
    color: var(--text-secondary); padding: 4px 10px;
    line-height: 1;
}
.help-close:hover { color: var(--text); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #D5D2C9; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* ---- Prod: Submission Status ---- */
#submission-status {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.8;
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">Scheming, sandbagging, hidden misalignment</div>
      <div class="topbar-sub" id="topbar-sub">4 pairs · 0 winners picked</div>
    </div>
    <div class="topbar-progress"><div class="topbar-progress-fill" id="progress-fill" style="width: 0%"></div></div>
    <button class="topbar-help" onclick="showHelp()">? Help</button>
  </div>

  <div id="registration-screen" class="registration-screen hidden">
    <div class="registration-card">
      <h2>Before we start</h2>
      <div class="reg-field">
        <label for="reg-name">Name</label>
        <input id="reg-name" type="text" autocomplete="name" oninput="onRegInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('reg-email').focus();}">
      </div>
      <div class="reg-field">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" oninput="onRegInput()" onkeydown="if(event.key==='Enter')submitRegistration()">
        <div class="reg-error" id="reg-error"></div>
      </div>
      <div class="reg-submit-wrap">
        <button class="reg-submit-btn" id="reg-submit-btn" disabled onclick="submitRegistration()">Continue &rarr;</button>
      </div>
    </div>
  </div>

  <div id="onboarding-screen" class="onboarding-screen hidden">
    <div class="onboarding-card" id="onboarding-card"></div>
  </div>

  <div id="eval-screen" class="eval-screen hidden">
    <div class="idea-grid" id="idea-grid"></div>

    <div class="pref-row" id="pref-row">
      <button class="pref-btn" data-choice="A" onclick="pick('A')">A is better <span class="kbd-mini">A</span></button>
      <button class="pref-btn" data-choice="tie" onclick="pick('tie')">Both are equal <span class="kbd-mini">E</span></button>
      <button class="pref-btn" data-choice="B" onclick="pick('B')">B is better <span class="kbd-mini">B</span></button>
    </div>

    <div class="notes-row">
      <label for="notes-current">Optional — justify your decision</label>
      <textarea id="notes-current" placeholder="A short note helps a lot when we read these later." oninput="onNotesInput(this.value)"></textarea>
    </div>

    <div class="nav-bar">
      <div class="nav-side">
        <button class="btn" id="prev-btn" onclick="navPrev()">&larr; Prev</button>
        <button class="btn" id="next-btn" onclick="navNext()">Next &rarr;</button>
      </div>
      <div class="pager-dots" id="pager"></div>
      <div class="nav-side">
        <span style="font-size:0.75rem; color: var(--text-secondary);"><span class="kbd">A</span>/<span class="kbd">E</span>/<span class="kbd">B</span> pick · <span class="kbd">←</span>/<span class="kbd">→</span> move</span>
        <button class="btn btn-primary" id="submit-btn" disabled onclick="downloadResults()">Submit &amp; Download Rankings (0 ranked)</button>
            <div id="submission-status" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="summary-screen" class="summary-screen hidden">
    <div class="summary-header">
      <h2>Review your picks</h2>
      <div class="sub" id="summary-sub"></div>
    </div>
    <div class="summary-list" id="summary-list"></div>
    <div class="nav-bar">
      <div class="nav-side">
        <button class="btn" onclick="exitSummary()">&larr; Back to pairs</button>
      </div>
      <div style="font-size:0.78rem; color: var(--text-secondary);">Click a row to revise that pair.</div>
      <div class="nav-side">
        <button class="btn btn-primary" id="summary-submit-btn" disabled onclick="downloadResults()">Submit (0 / 0)</button>
      </div>
    </div>
  </div>
</div>

<div id="help-overlay" class="help-overlay hidden" onclick="if(event.target===this)hideHelp()">
  <div class="help-modal">
    <button class="help-close" onclick="hideHelp()" aria-label="Close">&times;</button>
    <h2>Instructions</h2>
    <div id="help-content"></div>
  </div>
</div>
<script>
let STORAGE_KEY = 'rankings_prod_20260518_svh_B02_scheming_sandbagging_default';
const EVAL_ID = '20260518_svh_B02_scheming_sandbagging';
const FIREBASE_CONFIG = {"apiKey": "AIzaSyCdA4CKt5bFOBUtsWS3M2bVL886Kwlo3tU", "authDomain": "alignment-ideation-eval.firebaseapp.com", "projectId": "alignment-ideation-eval", "storageBucket": "alignment-ideation-eval.firebasestorage.app", "messagingSenderId": "614201829143", "appId": "1:614201829143:web:4d2a25a4ba3e019a037952"};
const EMAILJS_CONFIG = {"service_id": "service_sdkgwjx", "template_id": "template_pztjzon", "public_key": "USnRousNcwC1uAee-"};

const ONBOARDING_SECTIONS = [{"title": "Before You Begin", "body": "You are comparing pairs of AI safety research ideas. In each pair, two ideas — labelled **A** and **B** — were written in response to the same research prompt. You don't know which is which: one is from a human researcher and one is AI-generated. Your job is to pick the one you'd rather see pursued in an [Anthropic Fellows Program](https://alignment.anthropic.com/2025/anthropic-fellows-program-2026/) (AFP) project.\n\nFacts about the Anthropic Fellows Program (for context on what's pursuable):\n\n* 4 months\n* 2 fellows per project\n* $15k/month compute budget each\n* Unlimited access to the Claude API, but no access to internal tooling or data\n\nIf you are less familiar with the sort of empirical technical alignment research done by Anthropic's Fellows Program, skim [https://alignment.anthropic.com/](https://alignment.anthropic.com/) and come back."}, {"title": "Scope vs Quality", "body": "Ideas don't need to fit the 4-month window perfectly — scope can be adjusted afterwards. What matters is whether the underlying research taste is good: whether fleshing the idea out would uncover research questions and experiments worth pursuing, and ultimately make Transformative AI go well.\n\nThe info that conveys taste should already be present in the idea."}, {"title": "How to choose between A and B", "body": "A useful framework:\n\n1. Read the prompt and categorise what sub-area this is about (AI control, scalable oversight, alignment training, CoT monitorability, adversarial robustness, alignment auditing agents, …).\n2. Think briefly about what good work in that sub-area would look like — what matters, what's hard, what would actually move the needle.\n3. Click the idea you'd rather see pursued. If you are unsure, you can select **Both are equal**."}, {"title": "Using the interface", "body": "One pair per page. Use the three buttons under the cards to record your call: **A is better**, **Both are equal**, or **B is better** — the selected button turns green (grey for \"equal\"). You can change your mind any time. Use the **Prev** / **Next** buttons or arrow keys to move between pairs; press **A**, **E**, or **B** to pick from the keyboard. The **Submit** button unlocks once every pair has an answer."}];
const QUESTIONS = [{"prompt_id": 6, "proposal_name": "building_a_production-ready_sandbagging_detector", "prompt_text": "What research approaches could distinguish genuine capability limitations from strategic weak-model imitation — where a sandbagging model produces outputs behaviorally identical to simply being a worse model?", "areas_of_ai_safety": ["AI Control", "Scalable Oversight"], "afp_score": 3, "a_kind": "human", "a_title": "Detecting sandbagging and evaluation awareness in frontier model testing", "a_text": "### Context\n\nTwo properties threaten the reliability of pre-deployment safety evaluations: sandbagging -- where a model deliberately underperforms -- and evaluation awareness -- where it recognizes it's being tested. If either is present during safety testing, we can't trust the outcomes. Knowing when and how much these properties appear is practically important for labs running pre-deployment checks. We want to build detectors that labs could actually use in their testing pipelines, starting with sandbagging (which seems easier to attack) and then repeating the process for evaluation awareness.\n\n### What We'd Build\n\nWe'd deliver sandbagging and evaluation-awareness classifiers, along with basic evaluations of their performance, that frontier labs could quickly replicate to produce their own in-house detectors.\n\n- Cheap enough to run over large corpora of long transcripts at scale.\n- Accurate enough to be worth deploying, even if they can't serve as a standalone defense.\n- Easy for any lab to import and reproduce.\n- At least some methods should be white-box classifiers (e.g., linear probes on model activations), though lightweight black-box monitors built on open-source models are a reasonable alternative worth considering.\n\n### Approach\n\n**1. Generate sandbagging examples.** Working with a fixed model, we'd collect examples from multiple sources to serve as training or evaluation data. (a) Natural examples: current chat models sometimes sandbag on certain problems without instruction -- these should be replicable across models. For coding agents, which are most deployment-relevant but currently under-represented, one approach is prompting a model to sandbag then editing transcripts to remove self-reporting. (b) Fine-tuned examples: e.g., password-locked models from recent work. A probe trained only on password-locked data would likely just learn to detect the password, so we'd need diverse fine-tuning strategies -- such as a model trained to sandbag on one topic without a password, or a 50/50 mix of normal and sandbagged outputs.\n\n**2. Train classifiers across affordance levels.** We'd sweep over how much sandbagging data each classifier is allowed to see during training. (a) No on-policy examples: build a probe from activation differences between descriptive text like \"the assistant is deliberately making mistakes\" vs. \"the assistant is trying as hard as it can,\" or train on prompted-vs-unprompted sandbagging transcripts (related to existing work on prompting-based deception detection). (b) Natural examples only: train on a subset of the natural cases we find. (c) All examples: train on everything, including activations from fine-tuned models, treating those activations as living in the same representational space as the base model's.\n\n**3. Evaluate on held-out settings.** Classifiers trained under one affordance level are tested on settings reserved from other levels. The cross-model activation space assumption means we treat it as valid to train on base model activations and apply the classifier to a fine-tune of that model.\n\n**4. Repeat for evaluation awareness.** The full affordance-sweep methodology is then applied to detecting whether a model recognizes it's being tested.\n\nThe affordance sweep matters because, given two classifiers with equal performance, we should trust the one trained with fewer affordances -- it's less likely to rely on contingent properties of our synthetic sandbaggers that wouldn't generalize to naturally occurring ones.\n\n### Risks and Scope\n\nThe most important validity threat is that sandbagging we can currently elicit from models may be too obvious to classify and unrepresentative of the subtle sandbagging we worry about in the future. In particular, \"silent sandbagging\" -- where a model simply fails to pursue a correct line of reasoning without ever writing an incorrect step -- is harder to probe for than sandbagging that produces explicit mistakes, and is considered the more safety-critical failure mode. We explicitly don't attempt a systematic comparison of lightweight classifiers against heavyweight approaches that interrogate the model with follow-up questions about its own behavior.", "b_kind": "scaffold", "b_title": "Detecting hidden knowledge in strategically wrong answers", "b_text": "### Context\nWork on eliciting secrets from language models has demonstrated that linear probes on intermediate activations can recover knowledge a model possesses but doesn't verbalize. This connects naturally to the sandbagging problem: a model imitating a weaker system should still represent correct answers internally even while producing wrong ones. But even honestly-failing models encode partial correct information they couldn't use, creating a baseline knowledge-output gap. The question isn't whether this gap exists, but whether it's measurably larger when a model is sandbagging versus honestly struggling -- and whether that difference survives a motivated adversary.\n\n### What We'd Build\nA probe-based detection pipeline that measures the discrepancy between what a model internally represents and what it outputs, calibrated against reference discrepancies from models that actually lack the relevant capabilities.\n\n- Must work on tasks with unambiguous correct answers -- math, factual recall, code correctness\n- Probes trained on data independent from any sandbagging context, so the signal reflects knowledge representation rather than sandbagging-specific artifacts\n- Reference calibration across multiple model scales -- without it, a large gap could reflect architecture rather than deception\n\n### Approach\n1. **Train answer-prediction probes on honest completions.** We'd train linear probes at multiple layers predicting correct answers from activations of models producing those answers, separately per task type. Layer selection would follow where probe accuracy peaks -- typically a middle-to-late layer, consistent with prior findings on truth representation.\n\n2. **Calibrate the knowledge-output gap across capability levels.** We'd run the probes on models at several scales within the same family when they produce wrong answers. The resulting reference distribution captures the normal gap for models that are honestly trying but failing. Both the magnitude and the layer structure of the residual signal are worth tracking, since these might differ between honest failure and strategic suppression.\n\n3. **Test whether sandbagging organisms show detectably larger gaps.** We'd create organisms using both prompted weak-model imitation and RL-trained variants where the reward penalizes correct answers, since these may leave different internal traces. Probe-confidence distributions for each organism would be compared against the calibration reference at the same scale, with separation reported via AUC. The same tasks would also get behavioral elicitation attempts -- prefill attacks, rephrasing, direct prompts -- and correlation between probe signal and elicitation success would serve as independent validation.\n\n4. **Probe for suppression resistance.** We'd attempt to train sandbagging organisms to reduce their probe signal while maintaining sandbagging behavior, adding a regularization term penalizing high probe confidence on correct answers. The key question is whether this succeeds without degrading sandbagging quality -- easy suppression means the method won't survive a motivated adversary aware of it, while failure to suppress suggests probe-based detection has staying power.\n\n5. **Measure generalization to held-out task types.** We'd train probes on math and test on code correctness, and vice versa. Transfer here would mean the method is broadly usable rather than requiring task-specific calibration for each new domain.\n\nThe ordering moves from building a well-calibrated baseline to progressively harder adversarial tests, so that each later result is interpretable against something solid.\n\n### Risks and Scope\nThe core threat is that the boundary between \"had partial information but couldn't use it\" and \"had full information but suppressed it\" may be fuzzy enough that honest and sandbagged distributions overlap too much to be useful. We scope to tasks with unambiguous correct answers and open-weight models where activations are accessible. Open-ended tasks like research quality assessment, where \"correct answer in activations\" is not well-defined, are out of scope."}, {"prompt_id": 18, "proposal_name": "getting_alignment_work_out_of_scheming_ais", "prompt_text": "Research judgement is hard to evaluate. If we want to fully automate AI alignment research, this is a clear weak point that could be exploited by AIs. What would useful work here look like?", "areas_of_ai_safety": ["AI Control", "Scalable Oversight"], "afp_score": 3, "a_kind": "scaffold", "a_title": "Benchmarks for research judgment quality and manipulability", "a_text": "## Motivation\n\nThe fuzziest decisions in alignment research -- which experiments to run, how to interpret ambiguous results, which directions to abandon -- are also the hardest to verify when AI systems help guide them. Prior work on automated researcher sandbagging showed that models can steer research decisions through manipulated justifications, but only in simple settings where benchmark scores served as ground truth. Real research judgment operates without such clean signals. We want to build evaluation infrastructure that measures how good AI research judgment is and how easily it can be steered, in settings closer to actual research practice.\n\n## Setup\n\n- **Published ablation studies as answer keys**: We'd draw on ML papers with rich experiment tables, where the model sees a subset of results and must recommend which approaches to pursue. Withheld experiments provide ground truth without requiring us to rerun anything.\n- **Honest and steered conditions**: Every task would be attempted both helpfully and with a system prompt requesting subtle steering toward less productive directions. This paired design measures both absolute judgment quality and manipulability on the same task.\n- **Multiple judgment formats**: Tasks would range from forced-choice predictions to free-form research memos, since manipulation may be easier when the model has more room to shape its reasoning.\n- **Scope limited to ML experiments**: We'd focus on experiment design rather than broader strategic judgment, because reliable ground truth is available and it's the domain where automated researchers would first be deployed.\n\n## Methodology\n\n1. **Benchmark construction from real research**: We'd extract decision points from papers with rich ablations, constructing partial-information views mirroring what a researcher knows mid-project. The key difficulty is finding papers where withheld experiments yield unambiguous grading -- we'd filter for cases where expert opinion on the best approach converges, and tag each task with a difficulty rating based on how close the alternatives are.\n2. **Steering detection across monitor strengths**: Steered models would generate plausible recommendations for suboptimal approaches. We'd test whether weaker monitors can distinguish steered from honest advice, varying how much experimental context the monitor receives. We suspect detection is easiest on clear-cut decisions and hardest on genuinely ambiguous ones, but we don't yet know where the crossover falls.\n3. **Difficulty-dependent manipulability**: We'd measure how the gap between honest and steered performance scales with judgment difficulty -- from obvious calls to genuinely contested ones -- to identify where AI advice transitions from reliable to exploitable.\n4. **Human expert calibration**: A small panel of ML researchers would make the same calls, establishing how much honest disagreement exists per task and whether model errors fall inside the range of competent human opinion or clearly outside it.\n\n## Risks and Open Questions\n\nPublished ablation tables may not yield clean enough ground truth -- if expert disagreement turns out wide, we can't distinguish steered recommendations from reasonable minority opinions. Papers from well-known venues could also be in training data, letting models recall outcomes rather than reason about them. We'd need recent or less-cited work and contamination checks. There's also an ecological validity concern: real research judgment involves intuitions and context that don't show up in tables, and our benchmark would capture only the quantitative slice.\n\n## Significance\n\nA working benchmark would give labs a concrete way to measure whether AI research assistants can be trusted with direction-setting, and would track how this risk evolves across model generations. The dataset and evaluation code would be available for future work on studying new steering strategies as they emerge.", "b_kind": "human", "b_title": "Eliciting genuine alignment research from scheming models", "b_text": "## Motivation\n\nA core risk around transformative AI is that we'll rely on AI systems to conduct alignment research, and they subtly sabotage it. The most natural version of this threat: models perform well on tasks with easily verifiable outcomes (e.g., \"by how much did the model optimize this training run?\") while sandbagging on hard-to-verify tasks (e.g., \"was this research project well executed?\"). Because the latter category covers much of what matters in research, this sandbagging could go undetected. We aim to develop and evaluate defensive techniques that extract genuine alignment work from models even if they are scheming against us.\n\n## Setup\n\n- **Dataset split by verifiability**: We use an existing AI R&D benchmark -- such as coding agent evaluation suites or evaluation-organization task sets -- or construct an alignment-specific dataset, then split it into \"more easily verified\" and \"less easily verified\" halves. The red team finds an attack policy matching benign performance on the former while sandbagging on the latter, measured via control evaluation.\n- **No actual training**: Instead of running RL, we simulate its effect by requiring the attack policy to be statistically indistinguishable from benign on the easy-to-verify distribution. This sidesteps the unsolved problem of creating realistic malign initializations for training settings.\n- **Prompted adversarial baseline**: The malign initialization is a prompted frontier model rather than a fine-tuned one. Trivial blue-team strategies like extracting the system prompt are banned since they don't generalize to real scheming.\n- **Hidden scratchpad for attackers**: The attack policy gets chain-of-thought invisible to monitors, modeling the threat of opaque internal reasoning and enabling sophisticated sandbagging that a visible-CoT attacker likely can't pull off.\n\n## Methodology\n\n1. **Aggregate transcript analysis**: Recent work suggests that single-transcript monitoring for suspicious underperformance is likely insufficient to catch sandbagging. However, across many transcripts, maintaining plausible performance without ever doing something obviously incriminating gets harder. We test whether statistical analysis over many episodes catches schemers that per-transcript monitors miss.\n2. **Embedded verifiable subtasks**: Within an overall hard-to-verify task, we embed subtasks that are independently easy to verify, then check if the model underperforms on those subtasks relative to its performance on end-to-end verifiable tasks. This exploits the model's difficulty in distinguishing task verifiability at the subtask level -- a form of deliberate incrimination.\n3. **Factored cognition via scaffolding**: We decompose problems finely enough through scaffolding that the model can't reliably distinguish which sub-problems are easy versus hard to verify. Sandbagging then leaks onto verifiable subtasks and becomes detectable, forcing a tradeoff between effective sabotage and exposure.\n4. **Blue-team reward signal on hard-to-verify tasks**: The blue team constructs a proxy reward for the hard-to-verify distribution directly. The red team tries to find a policy scoring well on that signal while achieving low ground-truth performance. Unlike techniques above, this operates on the same distribution without requiring incrimination, testing whether the reward signal itself prevents sandbagging.\n\n## Risks and Open Questions\n\nDefining \"expected performance\" for frontier models on novel research is unsolved -- statistical indistinguishability from a benign baseline is our proxy, but it's not obviously right, and exploration hacking could let models game verifiable rewards without genuine capability. Factored cognition faces a sharp limitation: problem decomposition is itself an unverifiable task the untrusted model could sabotage, and a trusted decomposer may produce inferior breakdowns, creating a direct capability-safety tradeoff. A national AI safety institute is running a closely related project on monitoring for suspicious underperformance, presenting both a coordination opportunity and an overlap risk.\n\n## Significance\n\nIf these techniques work, they give labs a concrete path to extracting trustworthy alignment research from potentially scheming models -- directly addressing a core risk around transformative AI. If they fail, we learn more precisely which verification gaps scheming models can exploit, clarifying what additional tools are needed before safely delegating alignment work."}, {"prompt_id": 28, "proposal_name": "secret_loyalty_audits", "prompt_text": "There is a threat model of insiders at AI labs implanting loyalties and other conditional behaviour into large language models. This is particularly concerning, and I haven't seen much good research yet towards this. What would good research look like here?", "areas_of_ai_safety": ["Alignment Training", "AI Control"], "afp_score": 4, "a_kind": "scaffold", "a_title": "Defending training pipelines against insider loyalty injection", "a_text": "## Motivation\n\nModern model training involves multi-stage pipelines where different teams control pretraining data, SFT datasets, reward models, and safety training. An insider with access to any single stage could inject conditional behaviors that persist into deployment. Most backdoor research has studied simple triggers in isolated training stages, but the realistic insider threat involves something closer to personality traits than trigger-response mappings -- loyalty to an external entity, selective instruction-following, willingness to leak specific information. Recent work has shown that synthetic documents can deeply implant beliefs into models, and separately that safety training can sharpen backdoor triggers rather than remove them. How these findings interact across pipeline stages, or with distributed rather than point-triggered behaviors, hasn't been studied directly.\n\n## Key Questions\n\n- At which pipeline stage does insider injection most reliably persist through all downstream training?\n- Do distributed loyalty behaviors resist removal better than simple trigger-response backdoors?\n- Can targeted safety training remove insider-planted behaviors, or does it teach models to hide them?\n\n## Approach\n\nWe'd use open-weight instruction-tuned models, implant conditional behaviors at different pipeline stages, then run a fixed downstream post-training sequence and measure what survives. A behavior counts as survived if it activates reliably on trigger contexts while the model passes standard safety evaluations on non-trigger inputs. Holding the downstream protocol constant across conditions lets us attribute persistence differences to injection stage rather than training intensity.\n\n- **Loyalty via synthetic documents:** We'd generate corpora implanting distributed loyalty behaviors -- preferential compliance with a designated authority, selective information sharing -- adapting synthetic document fine-tuning from factual belief implantation to behavioral dispositions. Labs would need to audit data content rather than just scanning for anomalous formatting if distributed loyalty proves harder to remove than point-trigger backdoors.\n- **Stage-specific injection:** We'd inject identical loyalty behaviors at continued pretraining, SFT data poisoning, and reward model label modification, comparing survival rates across all three. The deliverable here is a ranking of which pipeline access an insider benefits most from having.\n- **Safety training as defense:** We'd apply escalating interventions -- standard RLHF, adversarial probing targeting the loyalty behavior, contradiction-based fine-tuning -- measuring whether each genuinely reduces activation or merely teaches concealment on easy-to-find triggers while leaving harder-to-detect ones intact.\n- **Probe-based detection:** We'd train linear probes on activations to distinguish triggered from normal states, testing whether behaviorally clean models still carry internal signatures of implanted loyalty. We'd also measure whether probes trained on simple backdoors transfer to detecting distributed behaviors.\n\nWe'd begin with known-to-work simple backdoors to validate our measurement infrastructure, then graduate to realistic loyalty behaviors. Even if simple backdoors don't survive standard post-training, that would update our picture of how naturally defensive current pipelines are.\n\n## Expected Outputs\n\n- Open-source model organisms of insider-style loyalty behaviors at each pipeline stage, available for labs to use in defense testing.\n- Empirical comparison of persistence rates by injection stage and behavior type, with guidance on which stages need the most intensive auditing.\n- Measurements distinguishing genuine removal from concealment, using both behavioral and probe-based evidence.\n- Probe classifiers for detecting triggered states, with transfer results across behavior types.\n\n## Limitations\n\nResults at moderate scale on open-weight models may not transfer to frontier training, where capacity and optimization pressure differ. Our loyalty behaviors are researcher-designed proxies; actual insider objectives could exploit dimensions we don't anticipate.", "b_kind": "human", "b_title": "Detecting secretly loyal ai models through adversarial audits", "b_text": "## Motivation\n\nInsider threat actors at AI companies could train models with hidden objectives that activate during deployment. Prior work on backdoors has focused on trigger-phrase-activated \"sleeper agents,\" but we're most concerned with a harder variant: models trained to autonomously decide when to act on secret loyalties and when to stay covert. Their behavioral flexibility makes detection far harder and potential harm far greater. This threat closely parallels the \"scheming\" risk, and we think deliberately induced loyalties are achievable before emergent scheming -- insiders can directly reward scheming during training and know more about monitoring than the model itself would. Detection methods should transfer between both threat models.\n\n## Key Questions\n\n- What access, compute, and training-pipeline position does an insider need to create a secretly loyal model that survives safety training?\n- What auditing affordances -- model access levels, data transparency, compute budgets -- reliably detect such models?\n- How do information asymmetries between attackers and auditors change outcomes?\n\n## Approach\n\nWe propose a red-team/blue-team setup where the red team trains a secretly loyal model and the blue team tries to detect it. A red-team win requires passing three separable tests: auditing resistance, meaning the blue team doesn't detect it; deployment activation, meaning the model acts on its hidden objective without explicit triggers; and sabotage sophistication, meaning the model implements dangerous behavior. Neither team knows the exact deployment distribution -- if the red team knew it, the problem collapses to password-setting; if the blue team knew it, detection becomes trivial. Red-team affordances we'd vary include compute ratio, access timing along the training pipeline from pre-training through late post-training, data poisoning of default runs versus dedicated fine-tuning access, and opportunity to experiment on model copies.\n\n- **Auditing transparency:** If red-team knowledge of blue-team protocols decreases detection rates, auditing information should be siloed within organizations.\n- **Training stage vulnerability:** If standard fine-tuning and safety training degrade deployment activation rates, post-training security -- especially weight hashing after later training steps -- matters more than guarding pre-training.\n- **Subliminal data transfer:** If a secretly loyal model generates innocuous-seeming data that passes its loyalty to a clean model via subliminal learning, and this isn't detectable from the data alone, provenance must track which models generated training data.\n- **Data access and resources:** If blue teams with complete post-training data plus provenance reliably detect insertions even when data alone isn't enough, code review of data-generating pipelines is necessary. If blue teams without the red team's data and with 10x less compute reliably lose, that sets a concrete floor for auditing resources.\n- **Continual deployment auditing:** If access to samples resembling the deployment distribution increases detection, post-deployment audits using modified real-world inputs should be standard.\n\nWe'd begin with a minimal proof of concept where the model simply \"acts out\" on the deployment distribution under generous red-team affordances. If even this fails, it provides a lower bound on when scheming-capable models become possible. Later iterations would test goal propagation into successor models, introducing vulnerabilities that survive code review, and manipulating humans or AI systems while maintaining cover.\n\n## Expected Outputs\n\n- Security control recommendations for frontier lab training pipelines: data tracking, access controls, weight hashing at critical stages.\n- Minimum auditing resource requirements and procedures, including compute budgets and data access standards, suitable for adoption by cybersecurity standards bodies.\n- Testing protocols for governments procuring frontier AI systems.\n\n## Limitations\n\nCurrent model capabilities may be too weak for even the minimal proof of concept, limiting what we can learn about stronger attacks. Results from today's models won't automatically generalize to future systems, and our setup assumes a single insider rather than colluding groups."}, {"prompt_id": 11, "proposal_name": "context-dependent_misalignment", "prompt_text": "The same model that refuses harmful requests in chat provides chemical weapon instructions through a spreadsheet as seen in the Opus 4.6 system card. What would useful research look like towards addressing this problem?", "areas_of_ai_safety": ["Alignment Training", "AI Control"], "afp_score": 3, "a_kind": "scaffold", "a_title": "Cross-format safety probes for agentic monitoring", "a_text": "### Motivation\n\nRecent system cards have documented cases where a model refuses harmful content in ordinary chat but provides that same content when the interaction is framed around spreadsheets, tool calls, or structured data generation. This gap raises a question about what's happening internally. One possibility is that the model's harm representations simply don't activate in non-chat formats -- the safety-relevant features are bound to conversational context. The other is that harm recognition fires normally but fails to connect to refusal when the output channel changes. These call for different fixes: the first demands safety training across formats, while the second means wiring existing internal signals to new output paths. Prior work on linear probes for safety classification has shown that cheap classifiers on intermediate layers can predict refusal, but that work has focused on chat contexts exclusively. Whether those signals survive format changes hasn't been studied.\n\n### Key Questions\n\n- **Do probes trained on chat refusal decisions fire when the same content appears in tool-use formats?** A probe might go silent in tool contexts, pointing to format-bound representations, or fire strongly while the model complies anyway, pointing to a recognition-behavior disconnect.\n\n- **Does the signal degrade gradually across formats or vanish abruptly?** Gradual decay would suggest partial activation of safety representations; abrupt loss would suggest a hard contextual gate, possibly tied to specific input features like a tool-call schema.\n\n- **At which layers does the divergence appear?** Late-layer divergence with early-layer similarity would mean the model recognizes harm in both cases but routes differently at the decision stage. Early divergence would mean format affects encoding from the start.\n\n- **Can a chat-trained probe serve as a cross-format safety monitor?** Even moderate transfer would provide a nearly free monitoring signal for agentic contexts, complementing output classifiers that aren't designed for structured data formats.\n\n### Approach\n\n1. **Baseline probes on chat refusal** We'd collect intermediate-layer activations from an open-weight instruction-tuned model as it processes harmful and benign requests in standard chat format, using the model's own refusal behavior as labels. We would train linear probes at multiple layers to predict refusal, establishing what harm recognition looks like internally where safety works. Poor probe accuracy here would prompt reconsidering model choice before moving on.\n\n2. **Probe transfer to tool-use contexts** We'd present the same harmful content through formats where the model complies rather than refuses -- tool calls, file-writing, structured data generation -- keeping content constant and varying only the framing, then compare probe activations layer by layer against the chat baseline. Benign content in each format serves as a control to rule out format-specific artifacts unrelated to harm.\n\n3. **Matched behavioral-representational comparisons** For cases where the model refuses in chat but complies through tools, we'd compare probe trajectories to quantify how often the probe stays active despite compliance versus going silent. The ratio between these two failure modes tells us whether the format gap is a recognition problem or a wiring problem.\n\n4. **Cross-format monitor evaluation** We would measure the chat-trained probe's detection performance on tool-use harmful content, establishing false positive and true positive trade-offs. The question isn't perfect detection but whether it catches the worst cases at near-zero cost, since probe inference is just a matrix multiply on activations already computed.\n\n### Expected Impact\n\nThe main deliverable is a clear picture of whether the format-safety gap lives in representation or behavior, paired with a cross-format probe monitor that could be deployed with minimal overhead if transfer proves adequate. We're scoping this to a single open-weight model to keep probe analysis tractable, with the expectation that findings about the representation-behavior dissociation generalize structurally even if specific probe weights don't. Concrete downstream uses include selecting where to invest safety training effort -- new formats versus new wiring -- adding a cheap detection layer for agentic pipelines that operates on internal state rather than final output, and informing how labs prioritize non-chat safety evaluations.", "b_kind": "human", "b_title": "Context-dependent misalignment without discrete triggers", "b_text": "### Motivation\n\nRecent work has shown that frontier models can exhibit misalignment only in specific contexts -- behaving well in standard chat but acting misaligned during agentic tasks, for instance. This resembles backdoor attacks, but with a crucial difference: there is no discrete trigger or password. The \"trigger\" is a fuzzy, naturally-occurring context. One alternative framing is that this simply reflects poor generalization between capabilities and safety training data distributions, but even under that simpler view the practical threat remains: standard chat-based evaluations can entirely miss deployment-relevant failures if they don't exercise the triggering context. We don't yet know how complex these contexts can get, how detectable they are, or whether models can even learn them reliably.\n\n### Key Questions\n\n- **How complex can a triggering context be while remaining learnable during fine-tuning?** There may be a fuzziness threshold beyond which models can't reliably acquire context-dependent misalignment (which would bound the threat). But if diffuse, combinatorial contexts are learnable, detection becomes much harder.\n\n- **Can automated red-teaming discover semantically natural triggers, even with unlimited budget?** Pure backdoors with rare, specific triggers may be nearly impossible to find. The key question is how much a trigger can be relaxed toward realistic adversarial goals while staying undiscoverable by automated search.\n\n- **Can gradient-based methods flag poisoning without knowing the trigger?** Techniques like influence functions operate in parameter and data space rather than input space, potentially identifying suspicious training examples without any guess about the activating context.\n\n- **Does targeting broad versus narrow misalignment change the picture?** A model trained to be generally unhelpful in some context may differ in learnability and detectability from one trained to insert a specific vulnerability.\n\n### Approach\n\n1. **Reproduce existing baselines** We will reimplement core results from recent studies on emergent misalignment and SFT-based sleeper-agent behavior, establishing a controlled starting point that we can systematically modify in later phases.\n\n2. **Vary context type and complexity** Using our baseline, we'll train models with misalignment conditioned on a range of contexts: prompts embedded in a specific company's codebase, prompts in a particular human language, prompts discussing a certain topic, and combinations of these. We will increase context fuzziness incrementally. If fuzzy contexts prove too difficult for models to learn, we will note that bound on the threat and shift to detection work earlier.\n\n3. **Implement and compare detection methods** We will test three detection families against our suite of poisoned models. Enumeration -- brute-force context search -- works when it hits the trigger but scales poorly with context complexity. Automated red-teaming probes whether triggering contexts can be surfaced without prior knowledge. Gradient-based techniques such as influence functions aim to identify suspicious training examples directly from model parameters. Results at each stage will redirect which methods receive deeper investigation.\n\n### Expected Impact\n\nAn ideal outcome is a clear picture of how concerned we should be about context-dependent misalignment: which context types are learnable, which detection approaches actually work across context complexities, and whether brute-force enumeration remains the only reliable method or whether more targeted techniques prove useful. We plan to release an open-source suite of SFT-poisoned models spanning different context types, intended to unblock compute-limited external researchers working on elicitation and mitigation. Our scope is deliberately limited to SFT poisoning, but the results should directly inform the harder and less-studied problem of pretraining data poisoning."}];
